<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tasarruf Yanımda · Canlı takip</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--yesil:#00724c;--turuncu:#ea803f;--yazi:#666;--koyu:#333;--cizgi:#ddd;--kutu:#eee;--acik:#e9f0ed;--zemin:#f4f5f3;--kirmizi:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;font-family:GOTHIC,"Century Gothic","Segoe UI",Arial,sans-serif;background:var(--zemin);color:var(--koyu)}
  header{background:var(--yesil);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;flex:1;min-width:200px}
  header small{opacity:.85;font-size:12px;font-weight:400}
  body.gomulu header{display:none}
  .bag{font-size:12px;border-radius:22px;padding:4px 10px;background:rgba(255,255,255,.16)}
  .bag.kopuk{background:#b25e30}
  body.gomulu .bag-ic{display:block}
  .bag-ic{display:none;font-size:12px;color:var(--yazi);margin:0 0 8px}
  main{padding:16px 20px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:16px;max-width:1500px;margin:0 auto}
  body.gomulu main{padding:12px}
  @media (max-width:980px){main{grid-template-columns:1fr;padding:12px}}
  section{background:#fff;border:1px solid var(--cizgi);border-radius:14px;padding:14px;margin-bottom:16px}
  h2{margin:0 0 10px;font-size:15px;color:var(--yesil);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h2 small{font-weight:400;color:var(--yazi);font-size:12px}
  .sayilar{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px}
  .sayilar div{background:#fff;border:1px solid var(--cizgi);border-radius:14px;padding:8px 12px}
  .sayilar b{display:block;font-size:22px;color:var(--yesil)}.sayilar span{font-size:12px;color:var(--yazi)}
  .sayilar .uyari b{color:var(--kirmizi)}
  section.yonetici{border:2px solid var(--kirmizi);background:#fff7f6}
  section.yonetici h2{color:var(--kirmizi)}
  .kart{border:1px solid var(--cizgi);border-radius:14px;padding:10px 12px;margin-bottom:10px;background:#fff}
  .kart.secili{border-color:var(--turuncu);box-shadow:0 0 0 2px #fbe3d2}
  .kart-ust{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;cursor:pointer}
  .kart-ust .ad{flex:1;min-width:160px}
  .kart b{font-size:14px}.kart small{display:block;font-size:12px;color:var(--yazi);margin-top:2px}
  .kart .gerekce{font-size:12px;color:var(--koyu);background:var(--zemin);border-radius:10px;padding:6px 8px;margin-top:8px}
  .kart-alt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .kart-alt label{font-size:12px;color:var(--yazi)}
  .hap{display:inline-block;border-radius:22px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .h-musait{background:var(--acik);color:var(--yesil)}.h-molada{background:var(--kutu);color:var(--yazi)}
  .h-yolda{background:#fdf1e8;color:#b25e30}.h-gorusmede{background:var(--yesil);color:#fff}.h-pasif{background:var(--kutu);color:#999}
  .d-alindi{background:#fce0d4;color:#b25e30}.d-atandi,.d-netlesti{background:var(--kutu);color:var(--yazi)}
  .d-yolda,.d-gorusme{background:#fdf1e8;color:#b25e30}.d-gorusmede{background:var(--yesil);color:#fff}
  .d-tamamlandi{background:var(--acik);color:var(--yesil)}.d-iptal{background:var(--kutu);color:#999}.d-yonetici{background:var(--kirmizi);color:#fff}
  .sure{font-weight:700;color:#b25e30;font-variant-numeric:tabular-nums}
  select,input[type=search]{font:inherit;font-size:13px;border:1px solid var(--cizgi);border-radius:10px;padding:7px 8px;background:#fff;max-width:100%}
  button{font:inherit;cursor:pointer}
  .dugme{font-size:13px;font-weight:700;border:0;border-radius:22px;padding:8px 14px;background:var(--turuncu);color:#fff;min-height:36px}
  .cipler{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .cipler button{font-size:12px;border:1px solid var(--cizgi);background:#fff;border-radius:22px;padding:6px 11px;min-height:32px}
  .cipler button[aria-pressed=true]{background:var(--yesil);border-color:var(--yesil);color:#fff}
  .spyler{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
  .spy{border:1px solid var(--cizgi);border-radius:14px;padding:8px;display:flex;gap:9px;align-items:center}
  .spy.pasif{opacity:.55}
  .spy img{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none}
  .spy b{display:block;font-size:13px}.spy small{display:block;font-size:11.5px;color:var(--yazi);margin-top:1px}
  .nokta{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;background:#bbb}
  .nokta.acik{background:#1fae6b}
  #harita{height:380px;border-radius:12px}
  @media (max-width:700px){#harita{height:300px}}
  .olaylar{list-style:none;margin:0;padding:0;max-height:420px;overflow-y:auto;font-size:12.5px}
  .olaylar li{padding:6px 0;border-bottom:1px solid #f0f0f0}.olaylar time{color:var(--yazi);margin-right:6px}
  .mesajlar{margin-top:8px;max-height:220px;overflow-y:auto;font-size:12.5px;background:var(--zemin);border-radius:10px;padding:8px}
  .mesajlar p{margin:0 0 5px}.mesajlar b{color:var(--yesil)}
  .bos{color:var(--yazi);font-size:12.5px;margin:0}
  .gizli{display:none}
  button.sifirla{font-size:12px;border:1px solid #fff;background:transparent;color:#fff;border-radius:22px;padding:5px 12px}
</style>
</head>
<body>
<header>
  <h1>Tasarruf Yanımda · Canlı takip <small>test sürümü</small></h1>
  <span class="bag" id="bag">Bağlanıyor…</span>
  <button class="sifirla" id="sifirla" type="button">Test verisini sıfırla</button>
</header>
<main>
  <div>
    <p class="bag-ic" id="bagIc">Bağlanıyor…</p>
    <div class="sayilar" id="sayilar"></div>
    <section class="yonetici gizli" id="yoneticiBolum"><h2>Yöneticiye düşen çağrılar <small>3 SPY kabul etmedi ya da uygun SPY yok; SPY seçip atayın</small></h2><div id="yoneticiListe"></div></section>
    <section><h2>Çağrılar <small>kabul süresi 2 dk; süre dolunca sıradaki SPY'ye geçer</small></h2><div id="cagrilar"></div></section>
    <section><h2>Harita</h2><div id="harita"></div></section>
  </div>
  <div>
    <section><h2>SPY'ler <small id="spyOzet"></small></h2>
      <div class="cipler" role="group" aria-label="SPY süz" id="spyCip"></div>
      <input type="search" id="spyAra" placeholder="Ad, mahalle ya da ilçe ara" aria-label="SPY ara" style="width:100%;margin-bottom:10px">
      <div class="spyler" id="spyler"></div>
    </section>
    <section><h2>Son olaylar</h2><ul class="olaylar" id="olaylar"></ul></section>
  </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  if(/[?&]gomulu=1/.test(location.search))document.body.classList.add("gomulu");
  var ILCE_RENK={"Üsküdar":"#00724c","Ümraniye":"#ea803f","Ataşehir":"#273755"};
  var DURUM={alindi:"Yeni · kabul bekliyor",atandi:"Kabul edildi · müşteri onayı bekleniyor",netlesti:"Randevu kesinleşti",yolda:"SPY yolda",gorusme:"SPY yolda",gorusmede:"Görüşmede",tamamlandi:"Tamamlandı",iptal:"İptal"};
  var KAPALI={tamamlandi:1,iptal:1};
  var ETIKET={musait:"Müsait",molada:"Molada",yolda:"Yolda",gorusmede:"Görüşmede",pasif:"Aktif değil"};
  var veri={spyler:[],kayitlar:{},olaylar:[]}, surum=0, secili=null, sifirlama=-1, fark=0, spyFiltre="tumu", secimler={};
  var harita=L.map("harita").setView([41.01,29.09],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(harita);
  var katman=L.layerGroup().addTo(harita);
  function e(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function saat(t){return t?new Date(t).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}):"";}
  function once(t){if(!t)return "";var dk=Math.round((Date.now()-t)/60000);return dk<1?"az önce":dk<60?dk+" dk önce":Math.floor(dk/60)+" sa "+(dk%60)+" dk önce";}
  function virgul(x){return String(x).replace(".",",");}
  function spy(id){return veri.spyler.filter(function(x){return x.id===id;})[0];}
  function spyAd(id){var s=spy(id);return s?s.ad:"-";}
  function acikMi(s){return Date.now()+fark-(s.sonGorulme||0)<30000;}
  function km(a,b){var r=Math.PI/180,x=(b.lng-a.lng)*r*Math.cos((a.lat+b.lat)/2*r),y=(b.lat-a.lat)*r;return Math.sqrt(x*x+y*y)*6371;}
  function spyDurum(s){
    if(!s.aktif)return "pasif";
    var k=Object.values(veri.kayitlar).filter(function(x){return x.repId===s.id;});
    if(k.some(function(x){return x.durum==="gorusmede";}))return "gorusmede";
    if(k.some(function(x){return x.durum==="yolda"||x.durum==="gorusme";}))return "yolda";
    return s.durum;
  }
  function kalanYazi(k){
    var t=k.teklif||{}; if(k.durum!=="alindi"||!k.repId||!t.bitis)return "";
    var sn=Math.max(0,Math.round((t.bitis-(Date.now()+fark))/1000));
    return Math.floor(sn/60)+":"+("0"+sn%60).slice(-2);
  }
  function spySecenek(k,bos){  // aktif SPY'ler önce, çağrının konumuna yakınlığa göre
    var liste=veri.spyler.slice().map(function(s){return {s:s,u:k.konum?km(s,k.konum):0};}).sort(function(a,b){return (b.s.aktif-a.s.aktif)||a.u-b.u;});
    return (bos?'<option value="">SPY seçin</option>':"")+liste.map(function(x){var s=x.s;return '<option value="'+s.id+'"'+(s.id===(secimler[k.id]||(bos?"":k.repId))?" selected":"")+'>'+e(s.ad)+' · '+virgul(x.u.toFixed(1))+' km'+(s.aktif?"":" · aktif değil")+(acikMi(s)?" · açık":"")+'</option>';}).join("");
  }
  function kartCiz(k,yonetici){
    var m=k.musteri||{}, s=spy(k.repId), t=k.teklif||{}, kalan=kalanYazi(k);
    var hap=yonetici?'<span class="hap d-yonetici">Yöneticiye düştü</span>':'<span class="hap d-'+e(k.durum)+'">'+e(DURUM[k.durum]||k.durum)+'</span>';
    var spyS=s?'<small>SPY: <b style="font-size:12px">'+e(s.ad)+'</b>'+(k.puan!=null?' · puan '+virgul(k.puan):"")+(k.durum==="alindi"&&(t.denenen||[]).length?' · '+t.denenen.length+'. teklif':"")+'</small>':(yonetici?"":'<small>SPY: -</small>');
    var sure=kalan?'<small>Kabul için kalan: <span class="sure" data-sure="'+e(k.id)+'">'+kalan+'</span></small>':"";
    var ger=k.gerekce?'<div class="gerekce">Neden bu SPY: '+e(k.gerekce)+'</div>':"";
    var aktar=KAPALI[k.durum]?"":'<div class="kart-alt"><label for="a-'+e(k.id)+'">'+(yonetici?"Ata:":"Aktar:")+'</label><select id="a-'+e(k.id)+'" data-sec="'+e(k.id)+'">'+spySecenek(k,yonetici||!k.repId)+'</select><button type="button" class="dugme" data-ata="'+e(k.id)+'">'+(yonetici?"Ata":"Aktar")+'</button></div>';
    var msj=secili===k.id?'<div class="mesajlar"><p><b>Mesajlar</b></p>'+((k.mesajlar||[]).map(function(x){return '<p><time>'+saat(x.t)+'</time> <b>'+(x.from==="temsilci"?e(spyAd(k.repId)):"Müşteri")+':</b> '+e(x.text)+'</p>';}).join("")||'<p class="bos">Mesaj yok.</p>')+'</div>':"";
    return '<div class="kart'+(secili===k.id?" secili":"")+'"><div class="kart-ust" data-id="'+e(k.id)+'"><div class="ad"><b>'+e(m.ad||"Müşteri")+'</b><small>'+e(m.tel)+(k.kaynak==="web"?" · web formu":"")+'</small><small>'+e(k.yer)+' · '+e(k.gunYazi||k.tarih)+' '+e(k.saat)+'</small>'+spyS+sure+'</div><div>'+hap+'<small style="text-align:right">'+saat(k.olusma)+' · '+once(k.olusma)+'</small></div></div>'+ger+aktar+msj+'</div>';
  }
  function ciz(){
    var kayitlar=Object.values(veri.kayitlar).sort(function(a,b){return (KAPALI[a.durum]?1:0)-(KAPALI[b.durum]?1:0)||(b.olusma||0)-(a.olusma||0);});
    var acik=kayitlar.filter(function(k){return !KAPALI[k.durum];});
    var yon=acik.filter(function(k){return k.yonetici&&!k.repId;});
    var aktifSay=veri.spyler.filter(function(s){return s.aktif;}).length, acikSay=veri.spyler.filter(acikMi).length;
    document.getElementById("sayilar").innerHTML=[["Açık çağrı",acik.length],["Kabul bekleyen",acik.filter(function(k){return k.durum==="alindi"&&k.repId;}).length],["Yöneticiye düşen",yon.length,yon.length?"uyari":""],["Yolda / görüşmede",acik.filter(function(k){return ["yolda","gorusme","gorusmede"].indexOf(k.durum)>=0;}).length],["Aktif SPY",aktifSay+" / "+veri.spyler.length],["Uygulaması açık",acikSay]]
      .map(function(x){return '<div class="'+(x[2]||"")+'"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>';}).join("");
    document.getElementById("yoneticiBolum").classList.toggle("gizli",!yon.length);
    document.getElementById("yoneticiListe").innerHTML=yon.map(function(k){return kartCiz(k,true);}).join("");
    var diger=kayitlar.filter(function(k){return yon.indexOf(k)<0;});
    document.getElementById("cagrilar").innerHTML=diger.length?diger.map(function(k){return kartCiz(k,false);}).join(""):'<p class="bos">Henüz çağrı yok. Müşteri uygulamadan ya da web formundan temsilci isteyince burada görünür.</p>';
    // SPY listesi
    document.getElementById("spyOzet").textContent=aktifSay+" aktif · "+acikSay+" uygulaması açık";
    document.getElementById("spyCip").innerHTML=[["tumu","Tümü"],["aktif","Aktif"],["acik","Uygulaması açık"],["pasif","Aktif değil"]].map(function(x){return '<button type="button" data-filtre="'+x[0]+'" aria-pressed="'+(spyFiltre===x[0])+'">'+x[1]+'</button>';}).join("");
    var ara=document.getElementById("spyAra").value.toLocaleLowerCase("tr");
    var gorunen=veri.spyler.filter(function(s){
      if(spyFiltre==="aktif"&&!s.aktif||spyFiltre==="pasif"&&s.aktif||spyFiltre==="acik"&&!acikMi(s))return false;
      return !ara||(s.ad+" "+s.mahalle+" "+s.ilce).toLocaleLowerCase("tr").indexOf(ara)>=0;
    });
    document.getElementById("spyler").innerHTML=gorunen.length?gorunen.map(function(s){
      var d=spyDurum(s), n=acik.filter(function(k){return k.repId===s.id;}).length, c=acikMi(s);
      return '<div class="spy'+(s.aktif?"":" pasif")+'"><img src="'+e(s.foto)+'" alt=""><div><b>'+e(s.ad)+'</b><small>'+e(s.mahalle)+', '+e(s.ilce)+'</small><small>H/G randevu %'+s.randevuHG+' · ciro %'+s.ciroHG+'</small><small><span class="nokta'+(c?" acik":"")+'"></span>'+(c?"Uygulama açık":s.sonGorulme?"Son görülme "+once(s.sonGorulme):"Henüz girmedi")+(n?' · '+n+' açık çağrı':"")+'</small><span class="hap h-'+d+'">'+ETIKET[d]+'</span></div></div>';
    }).join(""):'<p class="bos">Eşleşen SPY yok.</p>';
    // harita
    katman.clearLayers();
    veri.spyler.forEach(function(s){
      var r=ILCE_RENK[s.ilce]||"#999";
      L.marker([s.lat,s.lng],{opacity:s.aktif?1:.45,icon:L.divIcon({className:"",html:'<img src="'+e(s.foto)+'" style="width:28px;height:28px;border-radius:50%;border:3px solid '+(acikMi(s)?"#1fae6b":r)+';box-shadow:0 2px 6px rgba(0,0,0,.3)">',iconSize:[28,28],iconAnchor:[14,14]})}).bindTooltip(s.ad+" · "+s.mahalle+(s.aktif?"":" (aktif değil)")).addTo(katman);
    });
    acik.forEach(function(k){
      if(!k.konum)return;
      var y=k.yonetici&&!k.repId;
      L.circleMarker([k.konum.lat,k.konum.lng],{radius:10,color:"#fff",weight:2,fillColor:y?"#b3261e":"#ea803f",fillOpacity:1}).bindTooltip((k.musteri&&k.musteri.ad||"Müşteri")+" → "+(y?"yöneticiye düştü":spyAd(k.repId))).addTo(katman);
      var s=spy(k.repId);
      if(s)L.polyline([[s.lat,s.lng],[k.konum.lat,k.konum.lng]],{color:"#ea803f",weight:2,dashArray:"5 6",opacity:.8}).addTo(katman);
    });
    document.getElementById("olaylar").innerHTML=veri.olaylar.length?veri.olaylar.map(function(o){return '<li><time>'+saat(o.t)+'</time>'+e(o.metin)+'</li>';}).join(""):'<li class="bos">Olay yok.</li>';
  }
  document.getElementById("spyCip").addEventListener("click",function(ev){var b=ev.target.closest("button[data-filtre]");if(b){spyFiltre=b.dataset.filtre;ciz();}});
  document.getElementById("spyAra").addEventListener("input",ciz);
  document.body.addEventListener("change",function(ev){if(ev.target.dataset.sec)secimler[ev.target.dataset.sec]=ev.target.value;});
  document.body.addEventListener("click",function(ev){
    var ata=ev.target.closest("button[data-ata]");
    if(ata){
      var id=ata.dataset.ata, sec=document.querySelector('select[data-sec="'+id+'"]'), rep=sec&&sec.value;
      if(!rep){alert("Önce bir SPY seçin.");return;}
      var k=veri.kayitlar[id]; if(k&&rep===k.repId){alert("Çağrı zaten bu SPY'de.");return;}
      if(!confirm(spyAd(rep)+" kişisine atansın mı? SPY kabul edene kadar çağrı 'Yeni' görünür."))return;
      delete secimler[id]; gonder("aktar",{id:id,repId:rep}); return;
    }
    if(ev.target.closest("select"))return;
    var ust=ev.target.closest(".kart-ust[data-id]"); if(!ust)return;
    secili=secili===ust.dataset.id?null:ust.dataset.id; ciz();
  });
  document.getElementById("sifirla").addEventListener("click",function(){
    if(!confirm("Tüm test çağrıları ve mesajlar silinsin mi? (Sunucuda yedeği alınır.)"))return;
    gonder("sifirla",{onay:"evet"}).then(function(){veri.kayitlar={};surum=0;secili=null;});
  });
  function gonder(yol,govde){
    return fetch("api/"+yol,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(govde)})
      .then(function(r){return r.json().then(function(v){if(!r.ok)throw new Error(v.hata||r.status);return v;});})
      .then(function(v){tur(true);return v;}).catch(function(err){alert("İşlem yapılamadı: "+err.message);});
  }
  setInterval(function(){  // geri sayım: yalnız süre yazıları yenilenir
    document.querySelectorAll("[data-sure]").forEach(function(el){var k=veri.kayitlar[el.dataset.sure];if(k)el.textContent=kalanYazi(k)||"0:00";});
  },1000);
  var zaman=null;
  function tur(){
    clearTimeout(zaman);
    fetch("api/durum?hepsi=1&surum="+surum,{cache:"no-store"}).then(function(r){return r.json();}).then(function(v){
      if(v.sifirlama>sifirlama){if(sifirlama>=0)veri.kayitlar={};sifirlama=v.sifirlama;}
      if(v.simdi)fark=v.simdi-Date.now();
      surum=v.surum; veri.spyler=v.spyler; veri.olaylar=v.olaylar;
      v.kayitlar.forEach(function(k){veri.kayitlar[k.id]=k;});
      var yazi="Canlı · "+saat(Date.now());
      var b=document.getElementById("bag"); b.textContent=yazi; b.className="bag";
      document.getElementById("bagIc").textContent=yazi;
      var odak=document.activeElement;  // seçim kutusu açıkken yeniden çizme (seçim kaybolmasın)
      if(!(odak&&odak.tagName==="SELECT"))ciz();
    }).catch(function(){var b=document.getElementById("bag");b.textContent="Bağlantı yok";b.className="bag kopuk";document.getElementById("bagIc").textContent="Bağlantı yok";})
      .then(function(){zaman=setTimeout(tur,3000);});
  }
  tur();
})();
</script>
</body>
</html>
