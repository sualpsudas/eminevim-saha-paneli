<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tasarruf Yanımda · Saha Canlı</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--yesil:#00724c;--turuncu:#ea803f;--gri:#8a8f94;--kirmizi:#c62828;--yazi:#666;--koyu:#333;--cizgi:#ddd;--zemin:#f4f5f3}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:GOTHIC,"Century Gothic","Segoe UI",Arial,sans-serif;background:var(--zemin);color:var(--koyu);display:flex;flex-direction:column}
  header{background:var(--yesil);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{margin:0;font-size:17px;flex:1;min-width:180px}
  header small{opacity:.85;font-size:12px;font-weight:400}
  body.gomulu header{display:none}
  .bag{font-size:12px;border-radius:22px;padding:4px 10px;background:rgba(255,255,255,.16)}
  .bag.kopuk{background:#b25e30}
  button{font:inherit;cursor:pointer}
  button.sifirla{font-size:12px;border:1px solid #fff;background:transparent;color:#fff;border-radius:22px;padding:5px 12px}
  main{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px 16px;max-width:1500px;width:100%;margin:0 auto;min-height:0}
  body.gomulu main{padding:10px}
  .ust{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
  .sayi{background:#fff;border:1px solid var(--cizgi);border-radius:12px;padding:4px 10px;min-width:0;flex:1;display:flex;align-items:baseline;gap:6px}
  .sayi b{display:block;font-size:18px;line-height:1.1;color:var(--koyu);font-variant-numeric:tabular-nums}
  .sayi span{font-size:12px;color:var(--yazi)}
  .sayi.uyari b{color:var(--kirmizi)}
  .cipler{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .cipler button{font-size:13px;border:1.5px solid var(--cizgi);transition:background-color .12s,border-color .12s;background:#fff;border-radius:22px;padding:7px 12px;min-height:36px;display:inline-flex;align-items:center;gap:6px;color:var(--koyu)}
  .cipler button[aria-pressed=true]{background:#e9f0ed;border-color:var(--yesil);color:var(--yesil);font-weight:700}
  .cipler .bilgi{font-size:12px;color:var(--yazi);margin-left:auto}
  .menu-kap{position:relative}
  .menu-btn{font-weight:700}
  .menu-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:1500;background:#fff;border:1px solid var(--cizgi);border-radius:14px;padding:6px 14px 10px;min-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
  .menu-panel .m-bas{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-height:40px;margin-top:4px}
  .menu-panel label{display:flex;align-items:center;gap:8px;font-size:14px;min-height:36px;cursor:pointer}
  .menu-panel .alt-satir{padding-left:26px}
  .menu-panel .alt-satir.sonuk{opacity:.4}
  .menu-panel input{width:18px;height:18px;accent-color:var(--yesil)}
  .menu-panel .ay{height:1px;background:var(--cizgi);margin:6px 0}
  .cipler .grup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .cipler .grup+.grup{margin-left:14px;padding-left:14px;border-left:1.5px solid var(--cizgi)}
  .cipler .g-ad{font-size:12px;font-weight:700;color:var(--yazi);margin-right:2px}
  .renk{display:inline-block;box-sizing:border-box;width:12px;height:12px;border-radius:50%;border:2px solid #00724c;vertical-align:-1px}
  .r-bosta{background:#fff}.r-randevuda{background:#00724c}.r-molada{background:var(--gri)}.r-sahipsiz{background:var(--kirmizi)}
  .sahne{flex:1;display:flex;gap:10px;min-height:0}
  .sahne .harita-kap{min-width:0}
  .akis{width:320px;flex:0 0 320px;background:#fff;border:1px solid var(--cizgi);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .akis-ust{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--cizgi)}
  .akis-ust b{flex:1;font-size:14px}
  .ilerlet{font-size:13px;font-weight:700;border:0;background:var(--turuncu);color:#fff;border-radius:22px;padding:8px 14px;min-height:38px}
  .ilerlet:disabled{opacity:.5}
  #akisListe{flex:1;overflow-y:auto;margin:0;padding:0;list-style:none}
  #akisListe li{padding:9px 12px;border-bottom:1px solid #eee;font-size:13px;line-height:1.35;display:flex;gap:8px}
  #akisListe li time{color:var(--yazi);font-size:12px;font-variant-numeric:tabular-nums;flex:0 0 40px}
  #akisListe li.yeni{animation:akisYeni 2.4s ease-out}
  #akisListe li.cagri b{color:var(--turuncu)}
  @keyframes akisYeni{from{background:#fff1e3}to{background:transparent}}
  .cn{--c:#ea803f;--f:#fff;box-sizing:border-box;position:relative;width:18px;height:18px;border-radius:50%;background:var(--f);border:3px solid var(--c);box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .cn::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2.5px solid var(--c);opacity:0}
  .cn.s-alindi{--c:#ea803f;animation:yan .8s ease-in-out infinite}
  .cn.s-alindi::after,.cn.s-atandi::after,.cn.s-yolda::after{animation:halka 1.5s ease-out infinite}
  .cn.s-atandi{--f:#ea803f}
  .cn.s-yolda{--f:#ea803f}
  .cn.s-gorusmede{--f:#ea803f}
  @keyframes yan{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes halka{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
  .ipucu{display:inline-flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--yazi);margin-left:8px}
  .ipucu i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .musteri-ik{width:14px;height:14px;border-radius:50%;background:#1e3856;border:2px solid #fff;box-shadow:0 0 0 1.5px #1e3856}
  .harita-kap{flex:1;min-height:380px;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--cizgi);background:#fff}
  #harita{position:absolute;inset:0}
  .bos{color:var(--yazi);font-size:14px;margin:0;padding:16px;background:#fff;border:1px solid var(--cizgi);border-radius:12px}
  /* Uygulamanın içinde (Saha Canlı sekmesi): harita kısa, kişi kartları ilk ekranda */
  body.gomulu .harita-kap{flex:1;min-height:280px}
  /* Telefonda: sayfa kaymaz, yalnız harita hareket eder */
  .kisi-kart{display:none}
  @media (max-width:640px){
    html,body{overflow:hidden}
    main{overflow:hidden;gap:8px}
    .sayi{padding:4px 10px}
    .menu-panel label{min-height:44px}
    .cipler button{min-height:44px;padding:6px 6px;flex:0 0 auto;font-size:12px;gap:3px}
    .cipler .bilgi{flex:0 0 auto}
    body.gomulu .harita-kap,.harita-kap{flex:1;height:auto;min-height:0}
    .sahne{flex-direction:column}
    .akis{width:auto;flex:0 0 36%}
    .kisi-kart{position:fixed;left:8px;right:8px;bottom:8px;z-index:1000;background:#fff;border:1px solid var(--cizgi);border-radius:14px;padding:12px 14px;box-shadow:0 4px 16px rgba(0,0,0,.14);font-size:14px;line-height:1.5;gap:10px;align-items:flex-start}
    .kisi-kart:not([hidden]){display:flex}
    .kisi-kart > div{flex:1;min-width:0}
    .kisi-kart b{font-size:16px}
    .kisi-kart button{flex:0 0 44px;height:44px;border:0;border-radius:50%;background:#eee;color:var(--koyu);font-size:18px}
  }
  /* Harita simgeleri ve yazıları */
  .spy-ik{box-sizing:border-box;border-radius:50%;border:3px solid #00724c;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .cagri-ik{animation:yan .8s ease-in-out infinite;box-sizing:border-box;width:16px;height:16px;border-radius:50%;background:var(--kirmizi);border:2px solid #fff;box-shadow:0 0 0 3px rgba(198,40,40,.35)}
  .leaflet-tooltip.mah-ad{background:transparent;border:0;box-shadow:none;color:#4d5a55;font-size:10.5px;font-weight:600;text-shadow:0 0 3px #fff,0 0 3px #fff;padding:0}
  .leaflet-tooltip.mah-ad::before{display:none}
  .leaflet-tooltip.ilce-ad{background:rgba(255,255,255,.85);border:0;box-shadow:none;color:var(--yesil);font-size:13px;font-weight:800;padding:2px 8px;border-radius:10px}
  .leaflet-tooltip.ilce-ad::before{display:none}
  .gizli-ad .mah-ad{display:none}
  .leaflet-popup-content{font-size:13px;line-height:1.45;margin:10px 12px}
  .leaflet-popup-content b{font-size:14px}
  .ekle-kap{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .ekle-kap button{font-size:13px;font-weight:700;border:0;background:var(--yesil);color:#fff;border-radius:22px;padding:8px 14px;min-height:36px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .ekle-kap button.acik{background:#ea803f}
  .ekle-kap div{background:#fff;border-radius:10px;padding:6px 10px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.2);max-width:190px}
  .ekle-form{position:fixed;z-index:1100;left:50%;bottom:12px;transform:translateX(-50%);width:min(340px,calc(100% - 16px));background:#fff;border:1px solid var(--cizgi);border-radius:14px;padding:12px 14px;box-shadow:0 4px 16px rgba(0,0,0,.2);font-size:14px;display:flex;flex-direction:column;gap:8px}
  .ekle-form[hidden]{display:none}
  .ekle-form label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--yazi)}
  .ekle-form input{font-size:16px;padding:7px 8px;border:1.5px solid var(--cizgi);border-radius:8px}
  .ekle-hata{color:#b3261e;font-size:12px;min-height:14px}
  .ekle-dugme{display:flex;gap:8px;justify-content:flex-end}
  .ekle-dugme button{font-size:14px;border:1.5px solid var(--cizgi);background:#fff;border-radius:22px;padding:8px 14px;min-height:40px}
  .ekle-dugme button.tamam{background:var(--yesil);border-color:var(--yesil);color:#fff;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>Tasarruf Yanımda · Saha Canlı <small>test sürümü</small></h1>
  <span class="bag" id="bag">Bağlanıyor…</span>
  <button class="sifirla" id="sifirla" type="button">Test verisini sıfırla</button>
</header>
<main>
  <div class="ust" id="sayilar"></div>
  <div class="cipler" role="group" aria-label="Neler görünsün" id="cipler"></div>
  <div class="sahne">
    <div class="harita-kap"><div id="harita" aria-label="Pilot bölge haritası"></div></div>
    <aside class="akis" aria-label="Bildirimler"><div class="akis-ust"><b>Bildirimler</b><button type="button" class="ilerlet" id="ilerlet">Otomatik ilerlet</button></div><ul id="akisListe"></ul></aside>
  </div>
</main>
<div class="kisi-kart" id="kisiKart" hidden role="dialog" aria-label="Ayrıntı"><div id="kisiIc"></div><button type="button" id="kisiKapat" aria-label="Kapat">✕</button></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script>
  // Merkezde: <gizli>/takip → assets/…; GitHub Pages gösterisinde: merkez/takip.html?demo=1 → ../assets/…, ../veri/spyler.js
  var DEMO=/[?&]demo=1/.test(location.search), KOK=DEMO?"../":"";
  document.write('<script src="'+KOK+'assets/pilot-sinirlar.js"><\/script>'+(DEMO?'<script src="../veri/spyler.js"><\/script>':''));
</script>
<script>
(function(){
  if(/[?&]gomulu=1/.test(location.search))document.body.classList.add("gomulu");
  var HAL={bosta:["Boşta","#ffffff"],randevuda:["Randevuda","#00724c"],molada:["Molada","#8a8f94"]};
  var DURUM={yolda:"yolda",gorusme:"yolda",gorusmede:"görüşmede"};
  var KAPALI={tamamlandi:1,iptal:1};
  var veri={spyler:[],kayitlar:{},bugun:{gelen:0,gorusme:0}}, surum=0, sifirlama=-1, gP=true, gM=true, pSec={bosta:1,randevuda:1,molada:1}, mSec={alindi:1,atandi:1,yolda:1,gorusmede:1,sahipsiz:1}, menuAcik=false, ilkSinir=null;
  var harita=L.map("harita",{zoomSnap:.5}).setView([41.01,29.09],12);
  // Altlık: standart sokak haritası (OpenStreetMap; tüm caddeler ve yazılar çizili). Önceki sade gri vektör altlık için git geçmişine bak (2026-11-24).
  // 2026-11-25: sade, renkli vektör altlık (OpenFreeMap "bright" stili, renkleri Google Haritalar'a yaklaştırılmış; gereksiz katmanlar kapalı). Açılmazsa eski OSM resmi.
  function osmYedek(){L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(harita);}
  function sadeStil(st){
    var GIZLE=/^(poi_transit|road_oneway|ferry|railway|tunnel-railway|bridge-railway|aeroway|airport|boundary|cablecar|building|road_shield|waterway_line_label|highway-name-path|landuse-|landcover-(glacier|ice|sand)|label_(state|country))/;
    var ekle=[];
    st.layers.forEach(function(l){
      var p=l.paint=l.paint||{}, id=l.id;
      l.layout=l.layout||{};
      if(GIZLE.test(id)){l.layout.visibility="none";return;}
      if(id==="background")p["background-color"]="#f3f3f1";
      else if(/^(park|landcover-wood|landcover-grass)/.test(id)){p["fill-color"]="#cfe7c5";p["fill-opacity"]=1;}
      else if(/^water$|^water-intermittent$/.test(id)){p["fill-color"]="#8fd2ee";p["fill-opacity"]=1;}
      else if(/^waterway/.test(id))p["line-color"]="#8fd2ee";
      else if(/^(highway|bridge|tunnel)-/.test(id)&&l.type==="line"){
        var kasa=/casing/.test(id), buyuk=/motorway|trunk|primary/.test(id);
        p["line-color"]=buyuk?(kasa?"#aab6cc":"#e1e7f1"):(kasa?"#c9cdd3":"#ffffff");  // küçük sokak kenarı biraz koyu: sokak ağı seçilsin
        p["line-opacity"]=1;
      }
      else if(l.type==="symbol"){
        p["text-color"]="#5f6368";p["text-halo-color"]="#ffffff";p["text-halo-width"]=1.6;
        if(/^label_(other|village|town)$/.test(id)){l.layout["icon-image"]="";l.layout["text-size"]=11;l.layout["text-padding"]=28;}  // seyrek yazı: üst üste binenler elenir
        if(id==="label_other"){  // semt adları: uzakta çok seyrek (büyük boşluk), yakınlaştıkça sıklaşır. Not: MapLibre yakınlığı Leaflet'ten 1 eksik.
          l.minzoom=10; l.layout["text-padding"]=["interpolate",["linear"],["zoom"],10,80,11,60,12,36,14,12];
        }
        if(id==="label_village")l.layout.visibility="none";
        if(/^highway-shield/.test(id)){  // yol rozeti: otoyol ve ana yollarda, renkli (O turuncu, D mavi, E yeşil, diğer gri)
          l.filter=["all",l.filter,["in",["get","class"],["literal",["motorway","trunk","primary"]]]];
          l.layout["symbol-spacing"]=450; l.layout["icon-padding"]=18; l.layout["text-padding"]=18;  // seyrek: yol başına az rozet, birbirine yakın olanlar elenir
          var ilk=["slice",["to-string",["get","ref"]],0,1];
          l.layout["icon-image"]=["case",["==",ilk,"O"],"rozet-o",["==",ilk,"D"],"rozet-d",["==",ilk,"E"],"rozet-e","rozet-g"];
          l.layout["icon-text-fit"]="both"; l.layout["icon-text-fit-padding"]=[0,2,0,2]; l.layout["text-size"]=8.5;  // küçük rozet
          p["text-color"]=["case",["==",ilk,"O"],"#5b3a00","#ffffff"]; p["text-halo-width"]=0;
        }
        if(/^poi_r/.test(id)){  // ilgi noktalarından yalnız park adları, simgesiz
          l.filter=["all",l.filter,["in",["get","class"],["literal",["park","nature_reserve"]]]];
          l.layout["icon-image"]="";l.minzoom=10;p["text-color"]="#4f7a4a";
        }
      }
    });
    ekle.forEach(function(l){st.layers.push(l);});
    return st;
  }
  // Yol rozeti resimleri (kenarlı yuvarlak dikdörtgen; renk adından seçilir)
  var ROZET={"rozet-o":["#fcb64e","#e39320"],"rozet-d":["#5a8de0","#3d68b8"],"rozet-e":["#5db97c","#3d9560"],"rozet-g":["#8b929c","#6b7280"]};  // dolgu, kenar (Google Haritalar tonları)
  function rozetResmi(g){
    g.on("styleimagemissing",function(ev){
      var r=ROZET[ev.id]; if(!r)return;
      var c=document.createElement("canvas"); c.width=48; c.height=32; var x=c.getContext("2d");
      x.fillStyle=r[1]; x.beginPath(); x.roundRect(1,1,46,30,9); x.fill();
      x.fillStyle=r[0]; x.beginPath(); x.roundRect(4,4,40,24,6); x.fill();
      g.addImage(ev.id,x.getImageData(0,0,48,32),{pixelRatio:2,stretchX:[[14,34]],stretchY:[[10,22]],content:[12,8,36,24]});
    });
  }
  fetch("https://tiles.openfreemap.org/styles/bright").then(function(r){return r.json();}).then(function(st){
    var kat=L.maplibreGL({style:sadeStil(st)}).addTo(harita);
    try{window.TY_GL=kat.getMaplibreMap();rozetResmi(window.TY_GL);}catch(x){}
    harita.attributionControl.addAttribution('<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> &copy; OpenMapTiles, veri &copy; OpenStreetMap');
  }).catch(osmYedek);
  // Pilot bölge: ilçe sınırları kalın yeşil, mahalleler ince çizgi + ad (yakınlaşınca)
  var S=window.TY_SINIRLAR||{ilceler:[],mahalleler:[]};
  var ilceKatman=L.featureGroup().addTo(harita);
  S.ilceler.forEach(function(i){
    L.polygon(i.halkalar,{color:"#00724c",weight:1.5,opacity:.6,fillColor:"#00724c",fillOpacity:.03,interactive:false}).bindTooltip(i.ad,{permanent:true,direction:"center",className:"ilce-ad"}).addTo(ilceKatman);
  });
  function sigdir(){harita.invalidateSize();if(S.ilceler.length)harita.fitBounds(ilceKatman.getBounds(),{padding:[10,10]});}
  sigdir(); addEventListener("load",sigdir); setTimeout(sigdir,400);  // telefonda yerleşim geç oturuyor
  function adGorunur(){document.getElementById("harita").classList.toggle("gizli-ad",harita.getZoom()<13);}
  harita.on("zoomend",adGorunur); adGorunur();
  var spyKatman=L.layerGroup().addTo(harita), isaretler={}, cagriIsaret={};
  // Telefonda (dar ekran) ayrıntı balon yerine alttan kart olarak açılır; işaretler parmak için büyük
  var DAR=matchMedia("(max-width:640px)"), kisiKart=document.getElementById("kisiKart");
    function kartAc(html){document.getElementById("kisiIc").innerHTML=html;kisiKart.hidden=false;}
  function kartKapat(){kisiKart.hidden=true;}
  function bagla(m,html){if(DAR.matches)m.on("click",function(){kartAc(html);});else m.bindPopup(html);return m;}
  function ac(m,html){harita.setView(m.getLatLng(),Math.max(harita.getZoom(),14));if(DAR.matches)kartAc(html);else m.openPopup();}
  function e(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function saat(t){return t?new Date(t).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}):"";}
  function randevusu(s){return Object.values(veri.kayitlar).filter(function(k){return k.repId===s.id&&DURUM[k.durum];})[0];}
  // Sürükleyerek taşıma: müşteri yalnız çağrı kabul edilmeden önce, SPY yalnız kabul ettiği çağrı yokken (merkez de aynı kuralı denetler)
  var ATANMIS={atandi:1,netlesti:1,yolda:1,gorusme:1,gorusmede:1}, suruk=false;
  function spyTasinir(s){return !DEMO&&!Object.values(veri.kayitlar).some(function(k){return k.repId===s.id&&ATANMIS[k.durum];});}
  function musteriTasinir(k){return !DEMO&&k.durum==="alindi";}
  var TASI_IPUCU='<br><span style="color:#00724c">Taşımak için sürükleyin.</span>', TASINMAZ='<br><span style="color:#666">Kabul edilmiş çağrı var, taşınamaz.</span>';
  function surukle(m,t,id){
    if(!m.options.draggable)return m;
    m.on("dragstart",function(){suruk=true;});
    m.on("dragend",function(ev){
      var ll=ev.target.getLatLng();
      fetch("api/konum-tasi",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tur:t,id:id,lat:ll.lat,lng:ll.lng})})
        .then(function(r){return r.json().catch(function(){return {};}).then(function(v){if(!r.ok)throw new Error(v.hata||("Hata "+r.status));});})
        .catch(function(err){alert("Taşınamadı: "+err.message);})
        .then(function(){suruk=false;surum=0;tur();});
    });
    return m;
  }
  function spyBilgi(s){
    var h=HAL[s.hal]||HAL.bosta, r=randevusu(s);
    return '<b>'+e(s.ad)+'</b><br><span class="renk r-'+e(s.hal)+'"></span> '+h[0]+(r?' · '+(r.musteri&&r.musteri.ad||"Müşteri")+' ('+DURUM[r.durum]+')':'')+
      '<br>Bugün '+(s.bugunCagri||0)+' / 4 çağrı<br>'+(s.bildirim?'Bildirim: '+s.bildirim+' telefon':'Bildirim kapalı')+'<br><span style="color:#666">'+e(s.mahalle)+', '+e(s.ilce)+'</span>'+(DEMO?"":spyTasinir(s)?TASI_IPUCU:TASINMAZ);
  }
  function cagriBilgi(k){return '<b>Kimse almadı</b><br>'+e(k.musteri&&k.musteri.ad||"Müşteri")+'<br>'+e(k.yer)+'<br>'+e(k.gunYazi||k.tarih)+' '+e(k.saat)+'<br><span style="color:#666">Uygun SPY çıkınca kendiliğinden teklif edilir.</span>'+(DEMO?"":TASI_IPUCU);}
  var ASAMA={alindi:"çağrı geldi",atandi:"SPY kabul etti",netlesti:"saat onaylandı",yolda:"SPY yolda",gorusme:"SPY yolda",gorusmede:"görüşmede"};
  function musteriBilgi(k){
    var s=veri.spyler.filter(function(x){return x.id===k.repId;})[0];
    return '<b>'+e(k.musteri&&k.musteri.ad||"Müşteri")+'</b><br>'+e(ASAMA[k.durum]||k.durum)+(s?' · '+e(s.ad):'')+'<br>'+e(k.yer)+(k.varisZamani&&(k.durum==="yolda"||k.durum==="gorusme")?'<br>Tahmini varış '+saat(k.varisZamani):'')+(DEMO?"":musteriTasinir(k)?TASI_IPUCU:TASINMAZ);
  }
  // Yoldaki SPY → müşteri rotası (gerçek yol: OSRM genel sunucusu; olmazsa kuş uçuşu kesikli çizgi)
  var rotaKatman=L.layerGroup().addTo(harita), rotaOnbellek={}, rotaTur=0;
  function rotalar(){
    rotaKatman.clearLayers(); var tur=++rotaTur;
    acikCagrilar().forEach(function(k){
      var s=veri.spyler.filter(function(x){return x.id===k.repId;})[0]; if(!s)return;
      if(k.durum==="atandi"||k.durum==="netlesti"){  // temsilci belli, henüz yolda değil: ince kuş uçuşu çizgi
        if(!gM||!mSec.atandi||!gP||!pSec[s.hal])return;
        var c=s.konumAn||s;
        L.polyline([[c.lat,c.lng],[k.konum.lat,k.konum.lng]],{color:"#ea803f",weight:1.2,opacity:.75,interactive:false}).addTo(rotaKatman);
        return;
      }
      if(k.durum!=="yolda"&&k.durum!=="gorusme")return;
      var a=s.konumAn||s, b=k.konum, anah=k.id+"|"+a.lat.toFixed(4)+","+a.lng.toFixed(4), hazir=rotaOnbellek[anah];
      if(Array.isArray(hazir)){L.polyline(hazir,{color:"#ea803f",weight:3,opacity:.85,interactive:false}).addTo(rotaKatman);return;}
      L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:"#ea803f",weight:2,opacity:.7,dashArray:"6 8",interactive:false}).addTo(rotaKatman);
      if(hazir)return;  // "yok": kuş uçuşu kalır
      rotaOnbellek[anah]="bekle";
      fetch("https://router.project-osrm.org/route/v1/driving/"+a.lng+","+a.lat+";"+b.lng+","+b.lat+"?overview=full&geometries=geojson")
        .then(function(r){return r.json();}).then(function(j){
          rotaOnbellek[anah]=j.routes&&j.routes[0]?j.routes[0].geometry.coordinates.map(function(c){return [c[1],c[0]];}):"yok";
          if(tur===rotaTur)rotalar();
        }).catch(function(){rotaOnbellek[anah]="yok";});
    });
  }
  function acikCagrilar(){return Object.values(veri.kayitlar).filter(function(k){return !k.sahipsiz&&!KAPALI[k.durum]&&k.konum&&k.konum.lat!=null;});}
  function asama(k){return k.sahipsiz&&!k.repId?"sahipsiz":{alindi:"alindi",atandi:"atandi",netlesti:"atandi",yolda:"yolda",gorusme:"yolda",gorusmede:"gorusmede"}[k.durum]||"atandi";}
  function sahipsizler(){return Object.values(veri.kayitlar).filter(function(k){return k.sahipsiz&&!k.repId&&!KAPALI[k.durum]&&k.konum;});}
  function ciz(){
    var sayac={tumu:veri.spyler.length,bosta:0,randevuda:0,molada:0};
    veri.spyler.forEach(function(s){sayac[s.hal]=(sayac[s.hal]||0)+1;});
    var sah=sahipsizler();
    document.getElementById("sayilar").innerHTML=[["Gelen Çağrı",veri.bugun.gelen],["Görüşme Sayısı",veri.bugun.gorusme]].concat(sah.length?[["Kimse almadı",sah.length,"uyari"]]:[])
      .map(function(x){return '<div class="sayi '+(x[2]||"")+'"><b>'+x[1]+'</b><span>'+x[0]+' · bugün</span></div>';}).join("");
    var MAS=[["alindi","Yeni çağrı","#ffffff"],["atandi","Atandı","#ea803f"],["yolda","Yolda","#ea803f"],["gorusmede","Görüşmede","#ea803f"],["sahipsiz","Kimse almadı","#c0392b"]], msay={tumu:0,alindi:0,atandi:0,yolda:0,gorusmede:0,sahipsiz:0};
    Object.values(veri.kayitlar).forEach(function(k){if(KAPALI[k.durum]||!k.konum||k.konum.lat==null)return;var a=asama(k);msay.tumu++;msay[a]=(msay[a]||0)+1;});
    var PAS=[["bosta","Boşta","#ffffff"],["randevuda","Randevuda","#00724c"],["molada","Molada","#8a8f94"]];
    function satir(anah,grup,ad,renk,say,sec,acik){return '<label class="alt-satir'+(acik?"":" sonuk")+'"><input type="checkbox" data-'+grup+'="'+anah+'"'+(sec[anah]?" checked":"")+'><span class="renk" style="background:'+renk+(grup==="m"?';border-color:#ea803f':'')+'"></span>'+ad+' ('+say+')</label>';}
    var ozet=[gP?"Personel ("+sayac.tumu+")":"",gM?"Müşteri ("+msay.tumu+")":""].filter(Boolean).join(" · ")||"Hiçbiri";
    document.getElementById("cipler").innerHTML='<div class="menu-kap"><button type="button" class="menu-btn" id="menuBtn" aria-expanded="'+menuAcik+'">Göster: '+ozet+' ▾</button>'+(menuAcik?
      '<div class="menu-panel" id="menuPanel"><label class="m-bas"><input type="checkbox" id="gP"'+(gP?" checked":"")+'>Personel ('+sayac.tumu+')</label>'+
      PAS.map(function(x){return satir(x[0],"p",x[1],x[2],sayac[x[0]]||0,pSec,gP);}).join("")+
      '<div class="ay"></div><label class="m-bas"><input type="checkbox" id="gM"'+(gM?" checked":"")+'>Müşteri ('+msay.tumu+')</label>'+
      MAS.map(function(x){return satir(x[0],"m",x[1],x[2],msay[x[0]]||0,mSec,gM);}).join("")+'</div>':"")+'</div>';
    var gorunen=gP?veri.spyler.filter(function(s){return pSec[s.hal];}):[];
    spyKatman.clearLayers(); isaretler={}; cagriIsaret={}; var boy=18;
    gorunen.forEach(function(s){
      var k=s.konumAn||s, eslesti=acikCagrilar().some(function(c){return c.repId===s.id;}), renk=eslesti?"#00724c":(HAL[s.hal]||HAL.bosta)[1];  // temsilci belli olunca SPY de dolar
      var yanda=gM&&acikCagrilar().some(function(c){return Math.abs(c.konum.lat-k.lat)<.0005&&Math.abs(c.konum.lng-k.lng)<.0007;});  // müşterinin yanında: üst üste binmesin
      isaretler[s.id]=L.marker([k.lat,k.lng],{title:s.ad,draggable:spyTasinir(s),icon:L.divIcon({className:"",html:'<div class="spy-ik" style="background:'+renk+';width:'+boy+'px;height:'+boy+'px"></div>',iconSize:[boy,boy],iconAnchor:[yanda?boy/2-22:boy/2,boy/2]})});
      surukle(isaretler[s.id],"spy",s.id);
      bagla(isaretler[s.id],spyBilgi(s)).addTo(spyKatman);
    });
    acikCagrilar().filter(function(k){return gM&&mSec[asama(k)];}).forEach(function(k){
      var sinif={alindi:"s-alindi",atandi:"s-atandi",netlesti:"s-atandi",yolda:"s-yolda",gorusme:"s-yolda",gorusmede:"s-gorusmede"}[k.durum]||"s-atandi";
      var mk=L.marker([k.konum.lat,k.konum.lng],{title:(k.musteri&&k.musteri.ad)||"Müşteri",zIndexOffset:500,draggable:musteriTasinir(k),icon:L.divIcon({className:"",html:'<div class="cn '+sinif+'"></div>',iconSize:[18,18],iconAnchor:[9,9]})});
      surukle(mk,"musteri",k.id); bagla(mk,musteriBilgi(k)).addTo(spyKatman);
    });
    rotalar();
    sah.filter(function(){return gM&&mSec.sahipsiz;}).forEach(function(k){
      cagriIsaret[k.id]=L.marker([k.konum.lat,k.konum.lng],{title:"Kimse almadı",draggable:musteriTasinir(k),icon:L.divIcon({className:"",html:'<div class="cagri-ik"></div>',iconSize:[16,16],iconAnchor:[8,8]})});
      surukle(cagriIsaret[k.id],"musteri",k.id);
      bagla(cagriIsaret[k.id],cagriBilgi(k)).addTo(spyKatman);
    });
  }
  var cip=document.getElementById("cipler");
  cip.addEventListener("click",function(ev){if(ev.target.closest("#menuBtn")){menuAcik=!menuAcik;ciz();}});
  cip.addEventListener("change",function(ev){
    var t=ev.target;
    if(t.id==="gP")gP=t.checked; else if(t.id==="gM")gM=t.checked;
    else if(t.dataset.p)pSec[t.dataset.p]=t.checked?1:0; else if(t.dataset.m)mSec[t.dataset.m]=t.checked?1:0;
    ciz();
  });
  document.addEventListener("click",function(ev){if(menuAcik&&!ev.target.closest(".menu-kap")){menuAcik=false;ciz();}});
  document.getElementById("kisiKapat").addEventListener("click",kartKapat);
  document.getElementById("sifirla").addEventListener("click",function(){
    if(!confirm("Tüm test çağrıları ve mesajlar silinsin mi? (Sunucuda yedeği alınır.)"))return;
    fetch("api/sifirla",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({onay:"evet"})})
      .then(function(r){if(!r.ok)throw new Error(r.status);veri.kayitlar={};surum=0;tur();}).catch(function(err){alert("İşlem yapılamadı: "+err.message);});
  });
  var zaman=null, akisIlk=true, akisGorulen={};
  // Son olaylar → bildirim akışı: "Çağrı geldi · Ayşe Kaya, Üsküdar" gibi kısa satırlar
  function akisYazi(m){
    var x=/^Yeni çağrı: (.*?) \((.*?)\)/.exec(m); if(x)return '<b>Çağrı geldi</b> · '+e(x[1])+(x[2]?', '+e(x[2]):"");
    x=/^(.*?) \((.*?)\) → (.*?) · puan/.exec(m); if(x)return 'Çağrı iletildi · '+e(x[1])+' → '+e(x[3]);
    x=/^(.*?): (.*?) \((.*?)\)$/.exec(m); if(x)return e(x[1])+' · '+e(x[2])+' · '+e(x[3]);
    return e(m);
  }
  function akisCiz(olaylar){
    var liste=document.getElementById("akisListe");
    liste.innerHTML=(olaylar||[]).slice(0,40).map(function(o){
      var yeni=!akisIlk&&!akisGorulen[o.t+o.metin];
      return '<li class="'+(yeni?"yeni ":"")+(/^Yeni çağrı/.test(o.metin)?"cagri":"")+'"><time>'+saat(o.t)+'</time><span>'+akisYazi(o.metin)+'</span></li>';
    }).join("")||'<li><span style="color:var(--yazi)">Henüz çağrı yok</span></li>';
    var yeniler=(olaylar||[]).filter(function(o){return !akisGorulen[o.t+o.metin];});
    (olaylar||[]).forEach(function(o){akisGorulen[o.t+o.metin]=1;});
    if(!akisIlk&&"Notification" in window&&Notification.permission==="granted")yeniler.slice(0,3).forEach(function(o){
      if(/^Yeni çağrı/.test(o.metin)||!/^\S.* \(.*\) → /.test(o.metin))try{new Notification("Tasarruf Yanımda",{body:akisYazi(o.metin).replace(/<[^>]+>/g,"").replace(/&amp;/g,"&")});}catch(x){}
    });
    akisIlk=false;
  }
  addEventListener("click",function(){if("Notification" in window&&Notification.permission==="default")try{Notification.requestPermission();}catch(x){}},{once:true});
  document.getElementById("ilerlet").addEventListener("click",function(){
    var b=this; b.disabled=true;
    fetch("api/ilerlet",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})
      .then(function(r){if(!r.ok)throw new Error(r.status);surum=0;tur();}).catch(function(err){alert("İşlem yapılamadı: "+err.message);})
      .then(function(){b.disabled=false;});
  });
  // Çağrı ekle: düğme → haritada yere dokun → ad/telefon/yer formu → merkeze gerçek kayıt (Test verisini sıfırla'ya kadar kalır; uygulama akışı aynen çalışır)
  var ekleModu=false, ekleNokta=null, ekleIsaret=null, ekleForm=document.createElement("div");
  ekleForm.className="ekle-form"; ekleForm.hidden=true;
  ekleForm.innerHTML='<b>Örnek çağrı ekle</b><label>Ad Soyad<input id="eAd" autocomplete="off" value="Örnek Müşteri"></label><label>Telefon<input id="eTel" inputmode="tel" autocomplete="off" placeholder="05xx xxx xx xx"></label><label>Yer (mahalle/adres)<input id="eYer" autocomplete="off"></label><div class="ekle-hata" id="eHata"></div><div class="ekle-dugme"><button type="button" id="eVazgec">Vazgeç</button><button type="button" id="eGonder" class="tamam">Çağrıyı ekle</button></div>';
  document.body.appendChild(ekleForm);
  var ekleBtn=L.control({position:"topright"});
  ekleBtn.onAdd=function(){var d=L.DomUtil.create("div","ekle-kap");d.innerHTML='<button type="button" id="eBtn">+ Çağrı ekle</button><div id="eIpucu" hidden>Haritada müşterinin yerine dokunun</div>';L.DomEvent.disableClickPropagation(d);return d;};
  if(!DEMO)ekleBtn.addTo(harita);
  function ekleKapat(){ekleModu=false;ekleForm.hidden=true;if(ekleIsaret){harita.removeLayer(ekleIsaret);ekleIsaret=null;}var b=document.getElementById("eBtn");if(b)b.classList.remove("acik");var i=document.getElementById("eIpucu");if(i)i.hidden=true;harita.getContainer().style.cursor="";}
  document.addEventListener("click",function(ev){
    if(ev.target.id==="eBtn"){if(ekleModu){ekleKapat();return;}ekleModu=true;ev.target.classList.add("acik");document.getElementById("eIpucu").hidden=false;harita.getContainer().style.cursor="crosshair";}
    else if(ev.target.id==="eVazgec")ekleKapat();
    else if(ev.target.id==="eGonder"){
      var ad=document.getElementById("eAd").value.trim(), tel=document.getElementById("eTel").value.trim(), yer=document.getElementById("eYer").value.trim(), h=document.getElementById("eHata");
      if(!ad||!yer){h.textContent="Ad ve yer boş olamaz.";return;}
      ev.target.disabled=true; h.textContent="";
      fetch("api/cagri-ekle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ad:ad,tel:tel,yer:yer,lat:ekleNokta.lat,lng:ekleNokta.lng})})
        .then(function(r){return r.json().catch(function(){return {};}).then(function(v){if(!r.ok)throw new Error(v.hata||("Hata "+r.status));});})
        .then(function(){ekleKapat();surum=0;tur();})
        .catch(function(err){h.textContent="Eklenemedi: "+err.message;ev.target.disabled=false;});
    }
  });
  harita.on("click",function(ev){
    if(!ekleModu)return;
    ekleNokta=ev.latlng;
    if(ekleIsaret)harita.removeLayer(ekleIsaret);
    ekleIsaret=L.marker(ev.latlng,{icon:L.divIcon({className:"",html:'<div class="cagri-ik"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(harita);
    ekleForm.hidden=false; document.getElementById("eHata").textContent=""; document.getElementById("eGonder").disabled=false;
  });
  if(DEMO){  // gösteri: merkez yok; örnek durumlarla (canlı sürümde merkezden gelir)
    document.getElementById("sifirla").style.display="none"; document.getElementById("ilerlet").style.display="none";
    akisCiz([]);
    var ornek={}, bugunOrnek={};
    veri.spyler=(window.TY_SPYLER||[]).map(function(s){return Object.assign({},s,{hal:ornek[s.id]||"bosta",bugunCagri:bugunOrnek[s.id]||0,bildirim:0,konumAn:{lat:s.lat,lng:s.lng}});});
    veri.bugun={gelen:0,gorusme:0};
    document.getElementById("bag").textContent="Gösteri · örnek veri";
    ciz();
    return;
  }
  function tur(){
    clearTimeout(zaman);
    fetch("api/durum?hepsi=1&surum="+surum,{cache:"no-store"}).then(function(r){return r.json();}).then(function(v){
      if(v.sifirlama>sifirlama){if(sifirlama>=0)veri.kayitlar={};sifirlama=v.sifirlama;}
      surum=v.surum; veri.spyler=v.spyler; veri.bugun=v.bugun||veri.bugun; akisCiz(v.olaylar);
      v.kayitlar.forEach(function(k){veri.kayitlar[k.id]=k;});
      var b=document.getElementById("bag"); b.textContent="Canlı · "+saat(Date.now()); b.className="bag";
      if((!harita._popup||!harita.hasLayer(harita._popup))&&kisiKart.hidden&&!suruk)ciz();  // açık bilgi kutusu kapanmasın, sürükleme sırasında işaretler yenilenmesin
    }).catch(function(){var b=document.getElementById("bag");b.textContent="Bağlantı yok";b.className="bag kopuk";})
      .then(function(){zaman=setTimeout(tur,3000);});
  }
  tur();
})();
</script>
</body>
</html>
