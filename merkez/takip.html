<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tasarruf Yanımda · Saha Canlı</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--yesil:#00724c;--turuncu:#ea803f;--gri:#8a8f94;--kirmizi:#c62828;--yazi:#666;--koyu:#333;--cizgi:#ddd;--zemin:#f4f5f3}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:GOTHIC,"Century Gothic","Segoe UI",Arial,sans-serif;background:var(--zemin);color:var(--koyu);display:flex;flex-direction:column}
  header{background:var(--yesil);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{margin:0;font-size:17px;flex:1;min-width:180px}
  header small{opacity:.85;font-size:12px;font-weight:400}
  body.gomulu header{display:none}
  .bag{font-size:12px;border-radius:22px;padding:4px 10px;background:rgba(255,255,255,.16)}
  .bag.kopuk{background:#b25e30}
  button{font:inherit;cursor:pointer}
  button.sifirla{font-size:12px;border:1px solid #fff;background:transparent;color:#fff;border-radius:22px;padding:5px 12px}
  main{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px 16px;max-width:1500px;width:100%;margin:0 auto;min-height:0}
  body.gomulu main{padding:10px}
  .ust{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
  .sayi{background:#fff;border:1px solid var(--cizgi);border-radius:14px;padding:8px 14px;min-width:130px;flex:1}
  .sayi b{display:block;font-size:26px;line-height:1.1;color:var(--yesil);font-variant-numeric:tabular-nums}
  .sayi span{font-size:12px;color:var(--yazi)}
  .sayi.uyari b{color:var(--kirmizi)}
  .cipler{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .cipler button{font-size:13px;border:1px solid var(--cizgi);background:#fff;border-radius:22px;padding:7px 12px;min-height:36px;display:inline-flex;align-items:center;gap:6px;color:var(--koyu)}
  .cipler button[aria-pressed=true]{border-color:var(--koyu);box-shadow:inset 0 0 0 1px var(--koyu);font-weight:700}
  .cipler .bilgi{font-size:12px;color:var(--yazi);margin-left:auto}
  .renk{display:inline-block;width:10px;height:10px;border-radius:50%}
  .r-bosta{background:var(--yesil)}.r-randevuda{background:var(--turuncu)}.r-molada{background:var(--gri)}.r-sahipsiz{background:var(--kirmizi)}
  .harita-kap{flex:1;min-height:380px;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--cizgi);background:#fff}
  #harita{position:absolute;inset:0}
  #harita .leaflet-tile-pane{filter:saturate(.3) brightness(1.05)}
  .liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
  .liste button{display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border:1px solid var(--cizgi);border-radius:12px;padding:7px 10px;font-size:13px;color:var(--koyu);min-height:40px}
  .liste small{color:var(--yazi);font-size:11.5px;margin-left:auto;white-space:nowrap}
  .bos{color:var(--yazi);font-size:12.5px;margin:0}
  /* Harita simgeleri ve yazıları */
  .spy-ik{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
  .spy-ik svg{width:13px;height:13px}
  .cagri-ik{width:16px;height:16px;border-radius:50%;background:var(--kirmizi);border:2px solid #fff;box-shadow:0 0 0 3px rgba(198,40,40,.35)}
  .leaflet-tooltip.mah-ad{background:transparent;border:0;box-shadow:none;color:#4d5a55;font-size:10.5px;font-weight:600;text-shadow:0 0 3px #fff,0 0 3px #fff;padding:0}
  .leaflet-tooltip.mah-ad::before{display:none}
  .leaflet-tooltip.ilce-ad{background:rgba(255,255,255,.85);border:0;box-shadow:none;color:var(--yesil);font-size:13px;font-weight:800;padding:2px 8px;border-radius:10px}
  .leaflet-tooltip.ilce-ad::before{display:none}
  .gizli-ad .mah-ad{display:none}
  .leaflet-popup-content{font-size:13px;line-height:1.45;margin:10px 12px}
  .leaflet-popup-content b{font-size:14px}
</style>
</head>
<body>
<header>
  <h1>Tasarruf Yanımda · Saha Canlı <small>test sürümü</small></h1>
  <span class="bag" id="bag">Bağlanıyor…</span>
  <button class="sifirla" id="sifirla" type="button">Test verisini sıfırla</button>
</header>
<main>
  <div class="ust" id="sayilar"></div>
  <div class="cipler" role="group" aria-label="SPY'leri süz" id="cipler"></div>
  <div class="harita-kap"><div id="harita" aria-label="Pilot bölge haritası"></div></div>
  <div class="liste" id="liste"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Merkezde: <gizli>/takip → assets/…; GitHub Pages gösterisinde: merkez/takip.html?demo=1 → ../assets/…, ../spyler.js
  var DEMO=/[?&]demo=1/.test(location.search), KOK=DEMO?"../":"";
  document.write('<script src="'+KOK+'assets/pilot-sinirlar.js"><\/script>'+(DEMO?'<script src="../spyler.js"><\/script>':''));
</script>
<script>
(function(){
  if(/[?&]gomulu=1/.test(location.search))document.body.classList.add("gomulu");
  var HAL={bosta:["Boşta","#00724c"],randevuda:["Randevuda","#ea803f"],molada:["Molada","#8a8f94"]};
  var DURUM={yolda:"yolda",gorusme:"yolda",gorusmede:"görüşmede"};
  var KAPALI={tamamlandi:1,iptal:1};
  var KISI='<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c1.2-4.6 4.4-7 8.5-7s7.3 2.4 8.5 7z"/></svg>';
  var veri={spyler:[],kayitlar:{},bugun:{gelen:0,gorusme:0}}, surum=0, sifirlama=-1, filtre="tumu", ilkSinir=null;
  var harita=L.map("harita",{zoomSnap:.5}).setView([41.01,29.09],12);
  // Altlık: OpenStreetMap (CARTO artık anahtar istiyor); renkleri soluk, simgeler ve sınırlar öne çıksın
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,subdomains:"abc",attribution:"© <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> katkıcıları"}).addTo(harita);
  // Pilot bölge: ilçe sınırları kalın yeşil, mahalleler ince çizgi + ad (yakınlaşınca)
  var S=window.TY_SINIRLAR||{ilceler:[],mahalleler:[]};
  var mahKatman=L.layerGroup().addTo(harita), ilceKatman=L.featureGroup().addTo(harita);
  S.mahalleler.forEach(function(m){
    L.polygon(m.halkalar,{color:"#6f8a80",weight:.8,opacity:.7,fill:false,interactive:false}).addTo(mahKatman);
    L.tooltip({permanent:true,direction:"center",className:"mah-ad"}).setLatLng(m.merkez).setContent(m.ad).addTo(mahKatman);
  });
  S.ilceler.forEach(function(i){
    L.polygon(i.halkalar,{color:"#00724c",weight:2.5,fillColor:"#00724c",fillOpacity:.05,interactive:false}).bindTooltip(i.ad,{permanent:true,direction:"center",className:"ilce-ad"}).addTo(ilceKatman);
  });
  function sigdir(){harita.invalidateSize();if(S.ilceler.length)harita.fitBounds(ilceKatman.getBounds(),{padding:[10,10]});}
  sigdir(); addEventListener("load",sigdir); setTimeout(sigdir,400);  // telefonda yerleşim geç oturuyor
  function adGorunur(){document.getElementById("harita").classList.toggle("gizli-ad",harita.getZoom()<13);}
  harita.on("zoomend",adGorunur); adGorunur();
  var spyKatman=L.layerGroup().addTo(harita), isaretler={};
  function e(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function saat(t){return t?new Date(t).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}):"";}
  function randevusu(s){return Object.values(veri.kayitlar).filter(function(k){return k.repId===s.id&&DURUM[k.durum];})[0];}
  function spyBilgi(s){
    var h=HAL[s.hal]||HAL.bosta, r=randevusu(s);
    return '<b>'+e(s.ad)+'</b><br><span class="renk r-'+e(s.hal)+'"></span> '+h[0]+(r?' · '+(r.musteri&&r.musteri.ad||"Müşteri")+' ('+DURUM[r.durum]+')':'')+
      '<br>Bugün '+(s.bugunCagri||0)+' / 4 çağrı<br><span style="color:#666">'+e(s.mahalle)+', '+e(s.ilce)+'</span>';
  }
  function sahipsizler(){return Object.values(veri.kayitlar).filter(function(k){return k.sahipsiz&&!k.repId&&!KAPALI[k.durum]&&k.konum;});}
  function ciz(){
    var sayac={tumu:veri.spyler.length,bosta:0,randevuda:0,molada:0};
    veri.spyler.forEach(function(s){sayac[s.hal]=(sayac[s.hal]||0)+1;});
    var sah=sahipsizler();
    document.getElementById("sayilar").innerHTML=[["Gelen Çağrı",veri.bugun.gelen],["Görüşme Sayısı",veri.bugun.gorusme]].concat(sah.length?[["Kimse almadı",sah.length,"uyari"]]:[])
      .map(function(x){return '<div class="sayi '+(x[2]||"")+'"><b>'+x[1]+'</b><span>'+x[0]+' · bugün</span></div>';}).join("");
    document.getElementById("cipler").innerHTML=[["tumu","Tümü"],["bosta","Boşta"],["randevuda","Randevuda"],["molada","Molada"]].map(function(x){
      return '<button type="button" data-filtre="'+x[0]+'" aria-pressed="'+(filtre===x[0])+'">'+(x[0]==="tumu"?"":'<span class="renk r-'+x[0]+'"></span>')+x[1]+' ('+(sayac[x[0]]||0)+')</button>';
    }).join("")+(sah.length?'<span class="bilgi"><span class="renk r-sahipsiz"></span> Kimse almadı</span>':"");
    var gorunen=veri.spyler.filter(function(s){return filtre==="tumu"||s.hal===filtre;});
    spyKatman.clearLayers(); isaretler={};
    gorunen.forEach(function(s){
      var k=s.konumAn||s, renk=(HAL[s.hal]||HAL.bosta)[1];
      isaretler[s.id]=L.marker([k.lat,k.lng],{title:s.ad,icon:L.divIcon({className:"",html:'<div class="spy-ik" style="background:'+renk+'">'+KISI+'</div>',iconSize:[22,22],iconAnchor:[11,11]})})
        .bindPopup(spyBilgi(s)).addTo(spyKatman);
    });
    sah.forEach(function(k){
      L.marker([k.konum.lat,k.konum.lng],{title:"Kimse almadı",icon:L.divIcon({className:"",html:'<div class="cagri-ik"></div>',iconSize:[16,16],iconAnchor:[8,8]})})
        .bindPopup('<b>Kimse almadı</b><br>'+e(k.musteri&&k.musteri.ad||"Müşteri")+'<br>'+e(k.yer)+'<br>'+e(k.gunYazi||k.tarih)+' '+e(k.saat)+'<br><span style="color:#666">Uygun SPY çıkınca kendiliğinden teklif edilir.</span>').addTo(spyKatman);
    });
    document.getElementById("liste").innerHTML=gorunen.length?gorunen.map(function(s){
      return '<button type="button" data-spy="'+e(s.id)+'"><span class="renk r-'+e(s.hal)+'"></span>'+e(s.ad)+'<small>'+(HAL[s.hal]||HAL.bosta)[0]+' · '+(s.bugunCagri||0)+'/4</small></button>';
    }).join(""):'<p class="bos">Bu durumda SPY yok.</p>';
  }
  document.getElementById("cipler").addEventListener("click",function(ev){var b=ev.target.closest("button[data-filtre]");if(b){filtre=b.dataset.filtre;ciz();}});
  document.getElementById("liste").addEventListener("click",function(ev){
    var b=ev.target.closest("button[data-spy]"), m=b&&isaretler[b.dataset.spy];
    if(m){harita.setView(m.getLatLng(),Math.max(harita.getZoom(),14));m.openPopup();}
  });
  document.getElementById("sifirla").addEventListener("click",function(){
    if(!confirm("Tüm test çağrıları ve mesajlar silinsin mi? (Sunucuda yedeği alınır.)"))return;
    fetch("api/sifirla",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({onay:"evet"})})
      .then(function(r){if(!r.ok)throw new Error(r.status);veri.kayitlar={};surum=0;tur();}).catch(function(err){alert("İşlem yapılamadı: "+err.message);});
  });
  var zaman=null;
  if(DEMO){  // gösteri: merkez yok; örnek durumlarla (canlı sürümde merkezden gelir)
    document.getElementById("sifirla").style.display="none";
    var ornek={s1:"randevuda",s4:"molada",s15:"randevuda"}, bugunOrnek={s1:2,s2:1,s3:1,s15:2,s21:1};
    veri.spyler=(window.TY_SPYLER||[]).map(function(s){return Object.assign({},s,{hal:ornek[s.id]||"bosta",bugunCagri:bugunOrnek[s.id]||0,konumAn:{lat:s.lat,lng:s.lng}});});
    veri.bugun={gelen:9,gorusme:4};
    document.getElementById("bag").textContent="Gösteri · örnek veri";
    ciz();
    return;
  }
  function tur(){
    clearTimeout(zaman);
    fetch("api/durum?hepsi=1&surum="+surum,{cache:"no-store"}).then(function(r){return r.json();}).then(function(v){
      if(v.sifirlama>sifirlama){if(sifirlama>=0)veri.kayitlar={};sifirlama=v.sifirlama;}
      surum=v.surum; veri.spyler=v.spyler; veri.bugun=v.bugun||veri.bugun;
      v.kayitlar.forEach(function(k){veri.kayitlar[k.id]=k;});
      var b=document.getElementById("bag"); b.textContent="Canlı · "+saat(Date.now()); b.className="bag";
      if(!harita._popup||!harita.hasLayer(harita._popup))ciz();  // açık bilgi kutusu kapanmasın
    }).catch(function(){var b=document.getElementById("bag");b.textContent="Bağlantı yok";b.className="bag kopuk";})
      .then(function(){zaman=setTimeout(tur,3000);});
  }
  tur();
})();
</script>
</body>
</html>
