<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tasarruf Yanımda · Saha Canlı</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--yesil:#00724c;--turuncu:#ea803f;--gri:#8a8f94;--kirmizi:#c62828;--yazi:#666;--koyu:#333;--cizgi:#ddd;--zemin:#f4f5f3}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:GOTHIC,"Century Gothic","Segoe UI",Arial,sans-serif;background:var(--zemin);color:var(--koyu);display:flex;flex-direction:column}
  header{background:var(--yesil);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{margin:0;font-size:17px;flex:1;min-width:180px}
  header small{opacity:.85;font-size:12px;font-weight:400}
  body.gomulu header{display:none}
  body.gomulu.canli header{display:flex;justify-content:flex-end}
  body.gomulu.canli header>:not(#apBtn){display:none}
  .bag{font-size:12px;border-radius:22px;padding:4px 10px;background:rgba(255,255,255,.16)}
  .bag.kopuk{background:#b25e30}
  button{font:inherit;cursor:pointer}
  button.sifirla{font-size:12px;border:1px solid #fff;background:transparent;color:#fff;border-radius:22px;padding:5px 12px}
  main{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px 16px;max-width:1500px;width:100%;margin:0 auto;min-height:0}
  body.gomulu main{padding:10px}
  .ust{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
  .sayi{background:#fff;border:1px solid var(--cizgi);border-radius:12px;padding:4px 10px;min-width:0;flex:1;display:flex;align-items:baseline;gap:6px}
  .sayi b{display:block;font-size:18px;line-height:1.1;color:var(--koyu);font-variant-numeric:tabular-nums}
  .sayi span{font-size:12px;color:var(--yazi)}
  .sayi.uyari b{color:var(--kirmizi)}
  .cipler{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .cipler button{font-size:13px;border:1.5px solid var(--cizgi);transition:background-color .12s,border-color .12s;background:#fff;border-radius:22px;padding:7px 12px;min-height:36px;display:inline-flex;align-items:center;gap:6px;color:var(--koyu)}
  .cipler button[aria-pressed=true]{background:#e9f0ed;border-color:var(--yesil);color:var(--yesil);font-weight:700}
  .cipler .bilgi{font-size:12px;color:var(--yazi);margin-left:auto}
  .menu-kap{position:relative}
  .menu-btn{font-weight:700}
  .menu-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:1500;background:#fff;border:1px solid var(--cizgi);border-radius:14px;padding:6px 14px 10px;min-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
  .menu-panel .m-bas{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-height:40px;margin-top:4px}
  .menu-panel label{display:flex;align-items:center;gap:8px;font-size:14px;min-height:36px;cursor:pointer}
  .menu-panel .alt-satir{padding-left:26px}
  .menu-panel .alt-satir.sonuk{opacity:.4}
  .menu-panel input{width:18px;height:18px;accent-color:var(--yesil)}
  .menu-panel .ay{height:1px;background:var(--cizgi);margin:6px 0}
  .cipler .grup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .cipler .grup+.grup{margin-left:14px;padding-left:14px;border-left:1.5px solid var(--cizgi)}
  .cipler .g-ad{font-size:12px;font-weight:700;color:var(--yazi);margin-right:2px}
  .renk{display:inline-block;box-sizing:border-box;width:12px;height:12px;border-radius:50%;border:2px solid #00724c;vertical-align:-1px}
  .r-bosta{background:#fff}.r-randevuda{background:#00724c}.r-molada{background:var(--gri)}.r-sahipsiz{background:var(--kirmizi)}
  .sahne{flex:1;display:flex;gap:10px;min-height:0}
  .sahne .harita-kap{min-width:0}
  .akis{width:320px;flex:0 0 320px;background:#fff;border:1px solid var(--cizgi);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .akis-ust{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--cizgi)}
  .akis-ust b{flex:1;font-size:14px}
  .ilerlet{white-space:nowrap;font-size:13px;font-weight:700;border:0;background:var(--turuncu);color:#fff;border-radius:22px;padding:8px 14px;min-height:38px}
  .ilerlet:disabled{opacity:.5}
  .akis-ust .ik{width:38px;padding:0;font-size:17px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .akis-ust #ilerlet{font-size:24px;padding-bottom:3px}
  .akis-ust #oynat[aria-pressed=true]{background:var(--yesil)}
  .akis-ust .ekle-btn{width:46px;padding:0;font-size:15px}
  #akisListe{flex:1;overflow-y:auto;margin:0;padding:0;list-style:none}
  #akisListe li{padding:9px 12px;border-bottom:1px solid #eee;font-size:13px;line-height:1.35;display:flex;gap:8px}
  #akisListe li time{color:var(--yazi);font-size:12px;font-variant-numeric:tabular-nums;flex:0 0 40px}
  #akisListe li.yeni{animation:akisYeni 2.4s ease-out}
  #akisListe li.cagri b{color:var(--turuncu)}
  @keyframes akisYeni{from{background:#fff1e3}to{background:transparent}}
  .cn{--c:#ea803f;--f:#fff;box-sizing:border-box;position:relative;width:18px;height:18px;border-radius:50%;background:var(--f);border:3px solid var(--c);box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .cn::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2.5px solid var(--c);opacity:0}
  .cn.s-alindi{--c:#ea803f;animation:yan .8s ease-in-out infinite}
  .cn.s-alindi::after,.cn.s-atandi::after,.cn.s-yolda::after{animation:halka 1.5s ease-out infinite}
  .cn.s-randevu{background:linear-gradient(135deg,#fff 38%,#ea803f 38%,#ea803f 62%,#fff 62%);width:22px;height:22px}  /* müşteri önerilen randevuyu kabul etti: beyaz üstüne eğik turuncu çizgi + saat */
  .rsaat{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#b8571a;border:1px solid #ea803f;border-radius:10px;padding:1px 7px;font:600 11px/1.4 sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .cn.s-atandi{--f:#ea803f}
  .cn.s-yolda{--f:#ea803f}
  .cn.s-gorusmede{--f:#ea803f}
  @keyframes yan{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes halka{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
  .ipucu{display:inline-flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--yazi);margin-left:8px}
  .ipucu i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .musteri-ik{width:14px;height:14px;border-radius:50%;background:#1e3856;border:2px solid #fff;box-shadow:0 0 0 1.5px #1e3856}
  .harita-kap{flex:1;min-height:380px;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--cizgi);background:#fff}
  #harita{position:absolute;inset:0}
  .bos{color:var(--yazi);font-size:14px;margin:0;padding:16px;background:#fff;border:1px solid var(--cizgi);border-radius:12px}
  /* Uygulamanın içinde (Saha Canlı sekmesi): harita kısa, kişi kartları ilk ekranda */
  body.gomulu .harita-kap{flex:1;min-height:280px}
  /* Telefonda: sayfa kaymaz, yalnız harita hareket eder */
  .kisi-kart{display:none}
  @media (max-width:640px){
    html,body{overflow:hidden}
    main{overflow:hidden;gap:8px}
    .sayi{padding:4px 10px}
    .menu-panel label{min-height:44px}
    .cipler button{min-height:44px;padding:6px 6px;flex:0 0 auto;font-size:12px;gap:3px}
    .cipler .bilgi{flex:0 0 auto}
    body.gomulu .harita-kap,.harita-kap{flex:1;height:auto;min-height:0}
    .sahne{flex-direction:column}
    .akis{width:auto;flex:0 0 36%}
    .kisi-kart{position:fixed;left:8px;right:8px;bottom:8px;z-index:1000;background:#fff;border:1px solid var(--cizgi);border-radius:14px;padding:12px 14px;box-shadow:0 4px 16px rgba(0,0,0,.14);font-size:14px;line-height:1.5;gap:10px;align-items:flex-start}
    .kisi-kart:not([hidden]){display:flex}
    .kisi-kart > div{flex:1;min-width:0}
    .kisi-kart b{font-size:16px}
    .kisi-kart button{flex:0 0 44px;height:44px;border:0;border-radius:50%;background:#eee;color:var(--koyu);font-size:18px}
  }
  /* Harita simgeleri ve yazıları */
  .spy-ik{box-sizing:border-box;border-radius:50%;border:3px solid #00724c;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .spy-ik.hare{box-shadow:0 1px 3px rgba(0,0,0,.4),0 0 0 3px rgba(0,114,76,.28),0 0 0 4.5px rgba(0,114,76,.5)}  /* hareketli SPY: ince yeşil hare */
  .cagri-ik{animation:yan .8s ease-in-out infinite;box-sizing:border-box;width:16px;height:16px;border-radius:50%;background:var(--kirmizi);border:2px solid #fff;box-shadow:0 0 0 3px rgba(198,40,40,.35)}
  .leaflet-tooltip.mah-ad{background:transparent;border:0;box-shadow:none;color:#4d5a55;font-size:10.5px;font-weight:600;text-shadow:0 0 3px #fff,0 0 3px #fff;padding:0}
  .leaflet-tooltip.mah-ad::before{display:none}
  .leaflet-tooltip.spy-ad{display:none;background:rgba(255,255,255,.9);border:0;box-shadow:0 1px 3px rgba(0,0,0,.25);color:#1b3a2d;font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;pointer-events:none}
  .leaflet-tooltip.spy-ad::before{display:none}
  .sube-ik.diger{background:#8fb8a8;width:7px;height:7px;box-shadow:0 1px 2px rgba(0,0,0,.3)}  /* pilot dışı Anadolu Yakası şubesi: soluk */
  .sube-ik{width:8px;height:8px;border-radius:50%;background:#00724c;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .ap-onc{font:600 10.5px/1 inherit;color:#00724c;background:#e3f1ec;border-radius:8px;padding:2px 6px;margin-left:4px}
  .gm-ik{width:10px;height:10px;border-radius:50%;background:#ea803f;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .yakin-ad .leaflet-tooltip.spy-ad{display:block}
  .gizli-ad .mah-ad{display:none}
  .leaflet-popup-content{font-size:13px;line-height:1.45;margin:10px 12px}
  .leaflet-popup-content b{font-size:14px}
  .tr-kap{display:flex;align-items:center;gap:4px;background:#fff;border-radius:22px;padding:4px;box-shadow:0 2px 6px rgba(0,0,0,.25);font-size:13px}
  .tr-kap button{border:0;background:transparent;color:var(--yesil);font-weight:700;min-width:36px;min-height:36px;border-radius:18px;cursor:pointer;font-size:13px}
  .tr-kap button.acik{background:var(--yesil);color:#fff}
  body.gomulu #sbAc{display:none}  /* uygulama içindeki küçük haritada düğme kutusu dar kalsın (şubeler yine görünür) */
  .tr-kap .tr-ayar[hidden]{display:none}
  .tr-kap .tr-ayar{display:flex;align-items:center;gap:2px}
  .tr-kap output{min-width:46px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
  @media(max-width:640px){.leaflet-bottom.leaflet-left .tr-kap{margin-bottom:26px}}
  .tr-kap .tr-lej{display:flex;gap:2px;margin:0 4px}.tr-kap .tr-lej i{width:12px;height:8px;border-radius:2px;display:inline-block}
  .ekle-btn{font-size:13px;font-weight:700;border:0;background:var(--yesil);color:#fff;border-radius:22px;padding:8px 12px;min-height:38px;white-space:nowrap}
  .ekle-btn.acik{background:#b25e30}
  .e-ipucu{background:#fff1e3;color:#8a4a1c;padding:6px 12px;font-size:12px;border-bottom:1px solid var(--cizgi)}
  .ekle-form{position:fixed;z-index:1100;left:50%;bottom:12px;transform:translateX(-50%);width:min(340px,calc(100% - 16px));background:#fff;border:1px solid var(--cizgi);border-radius:14px;padding:12px 14px;box-shadow:0 4px 16px rgba(0,0,0,.2);font-size:14px;display:flex;flex-direction:column;gap:8px}
  .ekle-form[hidden]{display:none}
  .ekle-form label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--yazi)}
  .ekle-form input{font-size:16px;padding:7px 8px;border:1.5px solid var(--cizgi);border-radius:8px}
  .ekle-hata{color:#b3261e;font-size:12px;min-height:14px}
  .ekle-dugme{display:flex;gap:8px;justify-content:flex-end}
  .ekle-dugme button{font-size:14px;border:1.5px solid var(--cizgi);background:#fff;border-radius:22px;padding:8px 14px;min-height:40px}
  .ekle-dugme button.tamam{background:var(--yesil);border-color:var(--yesil);color:#fff;font-weight:700}
  /* Atama seçenekleri paneli (sağdan açılır; telefonda tam ekran) */
  .ap-ort{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:2000}
  .ap{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:2001;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.18)}
  .ap[hidden],.ap-ort[hidden],.ap label[hidden],.ap-not[hidden]{display:none}
  .ap-ust{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--cizgi)}
  .ap-ust h2{margin:0;font-size:17px;flex:1;color:var(--koyu)}
  .ap-ust button{width:44px;height:44px;border:0;border-radius:50%;background:#eee;color:var(--koyu);font-size:18px}
  .ap-ic{overflow:auto;padding:12px 16px 24px;font-size:14px;color:var(--koyu)}
  .ap fieldset{border:1px solid var(--cizgi);border-radius:12px;margin:0 0 12px;padding:6px 12px 10px}
  .ap legend{font-weight:700;padding:0 4px}
  .ap legend span{font-weight:400;color:var(--yazi);font-size:12px}
  .ap label{display:flex;align-items:center;gap:8px;min-height:40px}
  .ap label small{color:var(--yazi);font-size:12px}
  .ap label .ad{flex:1}
  .ap input[type=number]{width:76px;font:inherit;padding:6px 8px;border:1.5px solid var(--cizgi);border-radius:8px;min-height:38px;font-variant-numeric:tabular-nums}
  .ap input[type=radio],.ap input[type=checkbox]{width:18px;height:18px;accent-color:var(--yesil);flex:0 0 auto;margin:0}
  .ap-not{color:var(--yazi);font-size:12px;margin:4px 0 10px;line-height:1.45}
  .ap-dugme{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .ap-dugme button,.ap-dene{font-size:14px;border:1.5px solid var(--cizgi);background:#fff;color:var(--koyu);border-radius:22px;padding:8px 14px;min-height:40px}
  .ap-dugme .tamam{background:var(--yesil);border-color:var(--yesil);color:#fff;font-weight:700}
  .ap-durum{font-size:13px;color:var(--yesil);min-height:18px;margin-top:6px}
  .ap-durum.hata{color:var(--kirmizi)}
  .ap h3{font-size:15px;margin:18px 0 4px}
  .ap select{font:inherit;flex:1;min-width:0;min-height:40px;border:1.5px solid var(--cizgi);border-radius:8px;padding:4px 8px;background:#fff;color:var(--koyu)}
  .ap-blok{border:1px solid var(--cizgi);border-radius:12px;padding:10px 12px;margin:10px 0}
  .ap-bb{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
  .ap-bb span{font-size:12px;color:var(--yazi)}
  .ap-liste{margin:0;padding:0;list-style:none}
  .ap-liste li{padding:6px 0;border-top:1px solid #eee}
  .ap-liste li:first-child{border-top:0}
  .ap-sat{display:flex;align-items:center;gap:5px;width:100%;padding:3px 0;border:0;background:transparent;text-align:left;color:inherit;font:inherit;cursor:pointer;min-width:0}
  .ap-ad{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
  .ap-liste li.ilk .ap-ad{color:var(--yesil);font-weight:700}
  .ap-yakin{white-space:nowrap;font-size:12px;color:var(--yazi)}
  .ap-puan{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ap-ayr{font-size:12px;color:var(--yazi);line-height:1.45;padding:6px 0 2px}
  .ap-sube{margin:0 0 6px;color:var(--yazi)}
  .ap-olcut{display:grid;grid-template-columns:105px minmax(0,1fr) auto;gap:6px;padding:2px 0}
  .ap-olcut i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
  .ap-deger{color:var(--koyu)}
  @media(max-width:500px){.ap-sat{gap:6px;font-size:13px}.ap-yakin{font-size:12px}.ap-olcut{grid-template-columns:95px minmax(0,1fr) auto}}
  .ap-elenen{font-size:13px;margin-top:8px}
  .ap-elenen summary{cursor:pointer;min-height:32px;line-height:32px}
  .ap-elenen ul{margin:2px 0 0;padding-left:18px;color:var(--yazi)}
  /* Tam ekran (2026-11-26): harita sayfanın en arkasında; yeşil bar yok, düğmeleri aynı yerde; sayaçlar, süzgeç, Bildirimler haritanın üstünde */
  .tam-btn{width:34px;height:34px;border:0;background:#fff;color:var(--koyu);font-size:17px;line-height:34px;padding:0}
  .tam-btn[aria-pressed=true]{color:var(--yesil);font-weight:700}
  body.tam .harita-kap{position:fixed;inset:0;z-index:0;border:0;border-radius:0;min-height:0;pointer-events:auto}
  body.tam header{background:transparent;position:relative;z-index:2;pointer-events:none}
  body.tam header h1{flex:0 1 auto;min-width:0;background:#fff;color:var(--yesil);font-size:15px;border-radius:22px;padding:6px 14px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  body.tam header h1 small{color:var(--yazi)}
  body.tam header #apBtn{margin-left:auto}
  @media (min-width:641px){
    body.tam header .bag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
    body.tam aside.akis{position:fixed;right:16px;top:calc(var(--tam-hdr,52px) + 8px);width:300px;height:min(300px,calc(100vh - var(--tam-hdr,52px) - 50px));margin:0}
    body.tam .akis-ust{padding:7px 9px;gap:6px}
    body.tam .akis-ust b{font-size:13px}
    body.tam .akis .ekle-btn,body.tam .akis .ilerlet{min-height:32px}body.tam .akis .ik{width:34px}body.tam .akis .ekle-btn{width:42px}
    body.tam #akisListe li{font-size:12px;padding:6px 9px;gap:6px}
    body.tam #akisListe li time{font-size:11px;flex-basis:34px}
  }
  body.tam header>*{pointer-events:auto}
  body.tam .bag,body.tam button.sifirla{background:var(--yesil);border-color:var(--yesil);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  body.tam .bag.kopuk{background:#b25e30}
  body.tam main{position:relative;z-index:1;pointer-events:none}
  body.tam .ust,body.tam .cipler,body.tam .akis{position:relative;z-index:1}
  body.tam .ust>*,body.tam .cipler>*,body.tam .akis{pointer-events:auto}
  body.tam .ust{pointer-events:none}
  body.tam .sayi{flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  body.tam .akis{margin-left:auto;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  body.tam .leaflet-top{top:var(--tam-ust,0px)}
  body.tam .leaflet-top.leaflet-right{right:var(--tam-sag,0px)}
  body.tam .leaflet-bottom.leaflet-left{bottom:var(--tam-alt,0px)}
  @media (max-width:640px){body.tam .akis{margin-left:0;margin-top:auto;flex-basis:26%}body.tam .akis .ekle-btn,body.tam .akis .ilerlet{min-height:36px}body.tam header h1 small{display:none}body.tam header h1{font-size:14px}}
</style>
</head>
<body>
<header>
  <h1>Tasarruf Yanımda · Saha Canlı <small>test sürümü</small></h1>
  <span class="bag" id="bag">Bağlanıyor…</span>
  <button class="sifirla" id="apBtn" type="button" aria-haspopup="dialog">Atama seçenekleri</button>
  <button class="sifirla" id="sifirla" type="button">Test verisini sıfırla</button>
</header>
<main>
  <div class="ust" id="sayilar"></div>
  <div class="cipler" role="group" aria-label="Neler görünsün" id="cipler"></div>
  <div class="sahne">
    <div class="harita-kap"><div id="harita" aria-label="Pilot bölge haritası"></div></div>

<script>

<script>

  // Yol rozeti resimleri (kenarlı yuvarlak dikdörtgen; renk adından seçilir)

  // Pilot bölge: ilçe sınırları kalın yeşil, mahalleler ince çizgi + ad (yakınlaşınca)

  function adGorunur(){var h=document.getElementById("harita");h.classList.toggle("gizli-ad",harita.getZoom()<13);h.classList.toggle("yakin-ad",harita.getZoom()>=13);}  // yakınlaşınca personel adları görünür
  harita.on("zoomend",adGorunur); adGorunur();
  var spyKatman=L.layerGroup().addTo(harita), isaretler={}, cagriIsaret={};
  // Genel müdürlük: küçük turuncu nokta. Konum cadde düzeyinde (Ahmet Tevfik İleri Cd., Yamanevler); bina numarası haritada yok, ~±200 m sapabilir.
  L.marker([41.02873,29.11376],{title:"Genel Müdürlük",zIndexOffset:300,icon:L.divIcon({className:"",html:'<div class="gm-ik"></div>',iconSize:[10,10],iconAnchor:[5,5]})})
    .bindPopup("<b>Genel Müdürlük</b><br>Yamanevler, Ahmet Tevfik İleri Cd. No:20 A<br>Ümraniye / İstanbul").addTo(harita);
  // Şubeler: küçük yeşil nokta (veri/spyler.js → TY_SUBELER; ileri saatli çağrıda yakınlık SPY'nin şubesinden ölçülür)
  (window.TY_SUBELER||[]).forEach(function(sb){

  });
  // Pilot dışı Anadolu Yakası şubeleri (assets/anadolu-subeler.js, eminevim.com/subeler): soluk nokta, "Şubeler" düğmesiyle aç/kapa; atamaya girmez
  var subeKatman=L.layerGroup();
  (window.TY_SUBELER_DIGER||[]).forEach(function(sb){
    L.marker([sb.lat,sb.lng],{title:sb.ad,zIndexOffset:240,icon:L.divIcon({className:"",html:'<div class="sube-ik diger"></div>',iconSize:[7,7],iconAnchor:[3.5,3.5]})})
      .bindPopup("<b>"+e(sb.ad)+"</b><br>"+e(sb.adres)+'<br><span style="color:#666">Pilot bölge denemesi dışında</span>').addTo(subeKatman);

  var DAR=matchMedia("(max-width:640px)"), kisiKart=document.getElementById("kisiKart");
    function kartAc(html){document.getElementById("kisiIc").innerHTML=html;kisiKart.hidden=false;}

  function e(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function saat(t){return t?new Date(t).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}):"";}
  function randevusu(s){return Object.values(veri.kayitlar).filter(function(k){return k.repId===s.id&&DURUM[k.durum];})[0];}
  // Sürükleyerek taşıma: müşteri yalnız çağrı kabul edilmeden önce, SPY yalnız kabul ettiği çağrı yokken (merkez de aynı kuralı denetler)
  var ATANMIS={atandi:1,netlesti:1,yolda:1,gorusme:1,gorusmede:1}, suruk=false;
  function spyTasinir(s){return !DEMO&&!Object.values(veri.kayitlar).some(function(k){return k.repId===s.id&&ATANMIS[k.durum];});}
  function musteriTasinir(k){return !DEMO&&k.durum==="alindi";}
  var TASI_IPUCU='<br><span style="color:#00724c">Taşımak için sürükleyin.</span>', TASINMAZ='<br><span style="color:#666">Kabul edilmiş çağrı var, taşınamaz.</span>';
  function surukle(m,t,id){

  function ziyarette(s){var g=s.geziyor&&s.geziRota;return !!g&&Date.now()+saatFark>=g.bas+g.sure;}

    if(k.bolgeDisi)return '<b>Pilot bölge dışı</b><br>'+e(k.musteri&&k.musteri.ad||"Müşteri")+'<br>'+e(k.yer)+'<br><span style="color:#666">Temsilci gönderilmez, telefonla görüşülür. Bölge içine taşırsanız çağrı yeniden teklif edilir.</span>'+(DEMO?"":TASI_IPUCU);

  var ASAMA={alindi:"çağrı geldi",atandi:"SPY kabul etti",netlesti:"saat onaylandı",yolda:"SPY yolda",gorusme:"SPY yolda",gorusmede:"görüşmede"};
  function musteriBilgi(k){

  var trafikBtn=L.control({position:"bottomleft"});
  trafikBtn.onAdd=function(){
    var d=L.DomUtil.create("div","tr-kap");
    d.innerHTML='<button type="button" id="pbAc" aria-pressed="true" class="acik">Pilot bölge</button><button type="button" id="sbAc" aria-pressed="false">Şubeler</button><button type="button" id="trAc" aria-pressed="false">Trafik</button><span class="tr-ayar" id="trAyar" hidden>'+
      '<output id="trSaat" aria-live="polite"></output>'+
      '<span class="tr-lej" aria-hidden="true">'+[2,3,4,5].map(function(r){return '<i style="background:'+IBB_RENK[r]+'" title="'+IBB_AD[r]+'"></i>';}).join("")+'</span></span>';
    L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d); return d;
  };
  trafikBtn.addTo(harita);
  // Pilot bölge katmanı (ilçe sınırları): aç/kapa; seçim bu tarayıcıda hatırlanır
  function pbGoster(ac){var b=document.getElementById("pbAc");b.setAttribute("aria-pressed",ac);b.classList.toggle("acik",ac);
    if(ac&&!harita.hasLayer(ilceKatman))ilceKatman.addTo(harita);if(!ac&&harita.hasLayer(ilceKatman))harita.removeLayer(ilceKatman);
    try{localStorage.setItem("ty-pilot-bolge",ac?"1":"0");}catch(x){}}
  (function(){var v=null;try{v=localStorage.getItem("ty-pilot-bolge");}catch(x){}if(v==="0")pbGoster(false);})();
  function sbGoster(ac){var b=document.getElementById("sbAc");b.setAttribute("aria-pressed",ac);b.classList.toggle("acik",ac);
    if(ac&&!harita.hasLayer(subeKatman))subeKatman.addTo(harita);if(!ac&&harita.hasLayer(subeKatman))harita.removeLayer(subeKatman);
    try{localStorage.setItem("ty-subeler",ac?"1":"0");}catch(x){}}
  document.getElementById("sbAc").addEventListener("click",function(){sbGoster(this.getAttribute("aria-pressed")!=="true");});
  (function(){var v=null;try{v=localStorage.getItem("ty-subeler");}catch(x){}sbGoster(v!=="0");})();  // varsayılan açık
  // Tam ekran: harita en arkaya geçer; harita düğmeleri üstteki kutuların altında/yanında kalsın diye kenar boşlukları ölçülür
  var tamBtn=L.control({position:"topleft"});
  tamBtn.onAdd=function(){var d=L.DomUtil.create("div","leaflet-bar");d.innerHTML='<button type="button" class="tam-btn" id="tamAc" aria-pressed="false" title="Tam ekran" aria-label="Tam ekran">⛶</button>';L.DomEvent.disableClickPropagation(d);return d;};
  if(!document.body.classList.contains("gomulu"))tamBtn.addTo(harita);
  function tamKenar(){
    var b=document.body.style;if(!document.body.classList.contains("tam")){b.removeProperty("--tam-ust");b.removeProperty("--tam-sag");b.removeProperty("--tam-alt");b.removeProperty("--tam-hdr");return;}
    var sahne=document.querySelector(".sahne").getBoundingClientRect(),akis=document.querySelector(".akis").getBoundingClientRect(),dar=innerWidth<=640;
    b.setProperty("--tam-ust",Math.round(sahne.top)+"px");b.setProperty("--tam-hdr",Math.round(document.querySelector("header").getBoundingClientRect().bottom)+"px");
    b.setProperty("--tam-sag",dar?"0px":Math.round(innerWidth-akis.left)+"px");
    b.setProperty("--tam-alt",dar?Math.round(innerHeight-akis.top)+"px":"0px");
  }
  function tamGoster(ac){
    document.body.classList.toggle("tam",ac);var t=document.getElementById("tamAc");
    if(t){t.setAttribute("aria-pressed",ac?"true":"false");t.title=t.ariaLabel=ac?"Tam ekrandan çık":"Tam ekran";}
    tamKenar();harita.invalidateSize();
    try{localStorage.setItem("ty-tam-ekran",ac?"1":"0");}catch(x){}}
  var tamDugme=document.getElementById("tamAc");
  if(tamDugme)tamDugme.onclick=function(){tamGoster(!document.body.classList.contains("tam"));};
  addEventListener("resize",function(){if(document.body.classList.contains("tam")){tamKenar();harita.invalidateSize();}});
  addEventListener("keydown",function(e){if(e.key==="Escape"&&document.body.classList.contains("tam")&&document.getElementById("ap").hidden)tamGoster(false);});
  (function(){var v=null;try{v=localStorage.getItem("ty-tam-ekran");}catch(x){}if(v==="1"&&tamDugme)tamGoster(true);})();
  if(window.ResizeObserver){var tamRo=new ResizeObserver(function(){if(document.body.classList.contains("tam"))tamKenar();});tamRo.observe(document.querySelector(".sahne"));tamRo.observe(document.querySelector(".akis"));}
  document.getElementById("pbAc").addEventListener("click",function(){pbGoster(this.getAttribute("aria-pressed")!=="true");});
  document.getElementById("trAc").addEventListener("click",function(){
    var ac=this.getAttribute("aria-pressed")!=="true";
    this.setAttribute("aria-pressed",ac);this.classList.toggle("acik",ac);document.getElementById("trAyar").hidden=!ac;
    clearInterval(trSaatlik);
    if(!ac){trKapat();return;}
    document.getElementById("trSaat").value="…";
    trYukle();
    trSaatlik=setInterval(trYukle,180000);
  });
  // Atama seçenekleri (merkez: api/atama-ayar): ağırlıklar, uzaklık türü, eleme sınırları; altta seçili çağrının aday sıralaması
  var ap=document.getElementById("ap"), apOrt=document.getElementById("apOrt"), apForm=document.getElementById("apForm"), apBilgi=null, apDeneme=null, apSecili="", apAnahtar="";
  var apAcik=new Set();
  var OLCUT=[["yakinlik","Yakınlık","#00724c"],["yuk","Çağrı sayısı","#ea803f"],["ciro","Ciro H/G","#3f7fb8"],["randevu","Randevu H/G","#9a7bc0"]];
  function apIstek(govde){
    return fetch("api/atama-ayar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(govde)})
      .then(function(r){return r.json().catch(function(){return {};}).then(function(v){if(!r.ok)throw new Error(v.hata||("Hata "+r.status));return v.sonuc;});});
  }
  function sayi(x){return String(x).replace(".",",");}
  function apTur(){return (apForm.querySelector("input[name=uzaklik]:checked")||{}).value;}
  function apDoldur(b){
    apBilgi=b; var a=b.ayar;
    OLCUT.forEach(function(o){apForm.elements[o[0]].value=a.agirlik[o[0]];});
    document.getElementById("apTurler").innerHTML=Object.keys(b.turler).map(function(t){return '<label><input type="radio" name="uzaklik" value="'+t+'"'+(a.uzaklik===t?" checked":"")+'><span class="ad">'+e(b.turler[t])+'</span></label>';}).join("");
    ["sifirDk","sifirKm","gunlukSinir","aralikDk","oncelikKm","subeSaat","canliSaat"].forEach(function(x){apForm.elements[x].value=a[x];});
    apForm.elements.ilceOnceligi.checked=!!a.ilceOnceligi;
    apGorunum(); apAnahtar=""; apSiraCiz();
  }
  function apGorunum(){
    var t=apTur(), sure=t==="trafikli"||t==="yol";
    document.getElementById("apSifirDk").hidden=!sure; document.getElementById("apSifirKm").hidden=sure; document.getElementById("apCanli").hidden=t!=="trafikli";
  }
  function apOku(){
    var g={}, f=apForm.elements; OLCUT.forEach(function(o){g[o[0]]=+f[o[0]].value||0;});
    return {agirlik:g,uzaklik:apTur(),sifirDk:+f.sifirDk.value,sifirKm:+f.sifirKm.value,gunlukSinir:+f.gunlukSinir.value,aralikDk:+f.aralikDk.value,oncelikKm:+String(f.oncelikKm.value).replace(",","."),subeSaat:+f.subeSaat.value,canliSaat:+f.canliSaat.value,ilceOnceligi:f.ilceOnceligi.checked};
  }
  function apDurum(m,hata){var d=document.getElementById("apDurum");d.textContent=m;d.className="ap-durum"+(hata?" hata":"");}
  function apAc(){
    ap.hidden=false; apOrt.hidden=false; apDurum(""); apAnahtar=""; apSiraCiz(); document.getElementById("apKapat").focus();
    apIstek({islem:"oku"}).then(apDoldur).catch(function(err){apDurum("Seçenekler alınamadı: "+err.message,true);});
  }
  function apKapa(){ap.hidden=true; apOrt.hidden=true; document.getElementById("apBtn").focus();}
  document.getElementById("apBtn").addEventListener("click",apAc);
  document.getElementById("apKapat").addEventListener("click",apKapa);
  apOrt.addEventListener("click",apKapa);
  document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&!ap.hidden)apKapa();});
  apForm.addEventListener("input",apGorunum); apForm.addEventListener("change",apGorunum);
  apForm.addEventListener("submit",function(ev){
    ev.preventDefault();
    apIstek({islem:"kaydet",ayar:apOku()}).then(function(b){apDeneme=null;apDoldur(b);apDurum("Kaydedildi.");surum=0;tur();})
      .catch(function(err){apDurum("Kaydedilemedi: "+err.message,true);});
  });
  document.getElementById("apVarsayilan").addEventListener("click",function(){
    apIstek({islem:"varsayilan"}).then(function(b){apDeneme=null;apDoldur(b);apDurum("Varsayılana dönüldü.");surum=0;tur();})
      .catch(function(err){apDurum("İşlem yapılamadı: "+err.message,true);});
  });
  function apSiraHtml(s,baslik,deneme){
    var h='<div class="ap-blok"><div class="ap-bb"><b>'+e(baslik)+'</b></div>';
    h+=s.adaylar.length?'<ol class="ap-liste">'+s.adaylar.map(function(a,i){
      var key=apSecili+":"+a.id, acik=apAcik.has(key), parca=a.parca||{};
      var km=a.kaynak==="yok"||a.km==null?"—":sayi(a.km)+" km";
      var ozet=a.dk!=null&&a.kaynak!=="yok"?"~"+Math.round(a.dk)+" dk":km;  // km ile ölçülürken (yolkm/kus) dk yok: km gösterilir
      var yakin=km+(a.dk!=null&&a.kaynak!=="yok"?" · "+sayi(a.dk)+" dk":"")
        +(a.carpan&&a.carpan!==1?" ("+(a.trafik==="canlı"?"anlık ":"")+"trafik ×"+sayi(a.carpan)+(a.rotaSayisi>1?" · "+a.rotaSayisi+" rotadan en hızlısı":"")+")":"")
        +(a.kaynak==="kus"?" · kuş uçuşu":"")+(a.nereden?" · "+a.nereden:"");
      var spy=veri.spyler.find(function(x){return x.id===a.id;});
      var sube=(spy&&spy.sube)||a.subeIlce||"";
      var eski=(a.gerekce||"").match(/ciro\/randevu H\/G %([\d.,]+)\/%([\d.,]+)/);
      var ciro=a.ciroHG!=null?a.ciroHG:(eski?eski[1]:null), randevu=a.randevuHG!=null?a.randevuHG:(eski?eski[2]:null);
      var deger=[yakin,"o gün "+(a.cagri==null?"—":sayi(a.cagri))+" / "+(a.gunlukSinir==null?"—":sayi(a.gunlukSinir)),ciro==null?"—":"%"+sayi(ciro),randevu==null?"—":"%"+sayi(randevu)];
      return '<li'+(i===0?' class="ilk"':'')+'><button type="button" class="ap-sat" data-ap-aday="'+e(key)+'" aria-expanded="'+acik+'"><span class="ap-ad">'+e(a.ad)+'</span><span class="ap-yakin">'+e(ozet)+'</span><span class="ap-puan">'+e(sayi(a.puan))+' puan</span></button><div class="ap-ayr"'+(acik?'':' hidden')+'>'+(sube?'<div class="ap-sube">'+e(sube)+'</div>':'')+OLCUT.map(function(o,j){return '<div class="ap-olcut"><span><i style="background:'+o[2]+'"></i>'+o[1]+'</span><span class="ap-deger">'+e(deger[j])+'</span><span>'+e(parca[o[0]]==null?"—":sayi(parca[o[0]])+" p")+'</span></div>';}).join("")+'</div></li>';
    }).join("")+'</ol>':'<p class="ap-not">Uygun SPY yok.</p>';
    if(s.elenen&&s.elenen.length)h+='<details class="ap-elenen"><summary>Elenen '+s.elenen.length+' SPY</summary><ul>'+s.elenen.map(function(x){return '<li>'+e(x.ad)+' — '+e(x.neden)+'</li>';}).join("")+'</ul></details>';
    return h+'</div>';
  }
  function apSiraCiz(){
    if(ap.hidden)return;
    var liste=Object.values(veri.kayitlar).filter(function(k){return k.siralama;}).sort(function(a,b){return b.siralama.t-a.siralama.t;});
    if(!liste.some(function(k){return k.id===apSecili;}))apSecili=liste.length?liste[0].id:"";
    var anahtar=liste.map(function(k){return k.id+":"+k.siralama.t;}).join(",")+"|"+apSecili+"|"+(apDeneme?apDeneme.id+apDeneme.t:"")+"|"+!!apBilgi;
    if(anahtar===apAnahtar)return;  // değişiklik yoksa yeniden çizme (açık liste ve seçim bozulmasın)
    apAnahtar=anahtar;
    var sec=document.getElementById("apCagri"), kutu=document.getElementById("apSira");
    if(!liste.length){sec.innerHTML="";sec.disabled=true;kutu.innerHTML='<p class="ap-not">Çağrı yok.</p>';return;}
    sec.disabled=false;
    sec.innerHTML=liste.map(function(k){return '<option value="'+e(k.id)+'"'+(k.id===apSecili?" selected":"")+'>'+saat(k.siralama.t)+' · '+e((k.musteri&&k.musteri.ad)||"Müşteri")+(k.yer?' · '+e(k.yer):'')+'</option>';}).join("");
    var acik=[].map.call(kutu.querySelectorAll("details"),function(d){return d.open;});
    var k=veri.kayitlar[apSecili];
    kutu.innerHTML=apSiraHtml(k.siralama,"Atama anında"+(k.siralama.hemen?" · hemen çağrı":" · ileri saat"))+
      '<button type="button" class="ap-dene" id="apDene">Yeniden hesapla</button>'+
      (apDeneme&&apDeneme.id===apSecili?apSiraHtml(apDeneme,"Şimdiki seçeneklerle",true):"");
    [].forEach.call(kutu.querySelectorAll("details"),function(d,i){if(acik[i])d.open=true;});
  }
  document.getElementById("apCagri").addEventListener("change",function(){apSecili=this.value;apDeneme=null;apSiraCiz();});
  document.getElementById("apSira").addEventListener("click",function(ev){
    var sat=ev.target.closest("[data-ap-aday]");
    if(sat){var key=sat.getAttribute("data-ap-aday"), ac=!apAcik.has(key); if(ac)apAcik.add(key);else apAcik.delete(key);
      document.querySelectorAll("[data-ap-aday]").forEach(function(b){if(b.getAttribute("data-ap-aday")===key){b.setAttribute("aria-expanded",String(ac));b.nextElementSibling.hidden=!ac;}});return;}
    if(ev.target.id!=="apDene")return;
    ev.target.disabled=true;
    apIstek({islem:"dene",id:apSecili}).then(function(r){r.t=Date.now();apDeneme=r;apSiraCiz();})
      .catch(function(err){apDurum("Hesaplanamadı: "+err.message,true);ev.target.disabled=false;});
  });
  if(DEMO){  // gösteri: merkez yok; örnek durumlarla (canlı sürümde merkezden gelir)
    document.getElementById("sifirla").style.display="none"; document.getElementById("ilerlet").style.display="none"; document.getElementById("oynat").style.display="none"; document.getElementById("apBtn").style.display="none";
    akisCiz([]);
    var ornek={}, bugunOrnek={};
    veri.spyler=(window.TY_SPYLER||[]).map(function(s){return Object.assign({},s,{hal:ornek[s.id]||"bosta",bugunCagri:bugunOrnek[s.id]||0,bildirim:0,konumAn:{lat:s.lat,lng:s.lng}});});
    veri.bugun={gelen:0,gorusme:0};
    document.getElementById("bag").textContent="Gösteri · örnek veri";
    ciz();
    return;
  }
  function tur(){
    clearTimeout(zaman);
    fetch("api/durum?hepsi=1&surum="+surum,{cache:"no-store"}).then(function(r){return r.json();}).then(function(v){
      if(v.sifirlama>sifirlama){if(sifirlama>=0)veri.kayitlar={};sifirlama=v.sifirlama;}
      surum=v.surum; saatFark=(v.simdi||Date.now())-Date.now(); veri.spyler=v.spyler; veri.bugun=v.bugun||veri.bugun; akisCiz(v.olaylar);
      v.kayitlar.forEach(function(k){veri.kayitlar[k.id]=k;});
      apSiraCiz();
      var b=document.getElementById("bag"); b.textContent="Canlı · "+saat(Date.now()); b.className="bag";
      if((!harita._popup||!harita.hasLayer(harita._popup))&&kisiKart.hidden&&!suruk)ciz();  // açık bilgi kutusu kapanmasın, sürükleme sırasında işaretler yenilenmesin
    }).catch(function(){var b=document.getElementById("bag");b.textContent="Bağlantı yok";b.className="bag kopuk";})
      .then(function(){zaman=setTimeout(tur,3000);});
  }
  tur();
})();
</script>
