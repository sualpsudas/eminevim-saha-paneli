<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
html, body { margin: 0; height: 100%; font-family: 'Inter', -apple-system, sans-serif; }
#map { width: 100%; height: 100%; background: #E9EEF1; }
body.dark #map { background: #1A1E24; }
/* Açık tema: OSM'yi sakinleştir (marka tonuna yakın, işaretçiler öne çıksın) */
.leaflet-tile-pane { filter: saturate(.45) contrast(.94) brightness(1.04); }
/* Koyu tema: OSM tile'larını yumuşak ters çevir */
body.dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(.9) saturate(.55); }
body.dark .leaflet-control-attribution { background: rgba(30,34,41,.85); color: #9AA3AD; }
body.dark .leaflet-control-attribution a { color: #B7C0C8; }

/* Kontroller: sağ alt, dokunmaya uygun */
.leaflet-bottom.leaflet-right { margin-bottom: 26px; }
.leaflet-control-zoom a { width: 34px !important; height: 34px !important; line-height: 34px !important; font-size: 18px !important; }
.leaflet-bar { border: none !important; box-shadow: 0 2px 8px rgba(23,33,54,.22) !important; border-radius: 10px !important; overflow: hidden; }
.leaflet-bar a { background: #fff; color: #2B2F2C; }
body.dark .leaflet-bar a { background: #262A32; color: #EDEFF2; border-color: #2B303A !important; }
.fit-btn { display:flex; align-items:center; justify-content:center; width:34px; height:34px; background:#fff; cursor:pointer; }
body.dark .fit-btn { background:#262A32; }
body.compact .leaflet-control-zoom, body.compact .leaflet-bar, body.compact #legend { display: none !important; }

/* İşaretçiler */
.mk { position: relative; }
.mk-avatar { width: 30px; height: 30px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font: 800 11px Inter, sans-serif; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.28); letter-spacing: .2px; position: relative; }
.mk-avatar .st { position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; }
.mk-self { width: 18px; height: 18px; border-radius: 50%; background: #276F4E; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(39,111,78,.35), 0 2px 6px rgba(0,0,0,.3); position: relative; }
.pulse::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; background: inherit; opacity: .45; animation: pulseRing 1.7s ease-out infinite; z-index: -1; }
@keyframes pulseRing { 0% { transform: scale(.35); opacity: .5; } 100% { transform: scale(2.2); opacity: 0; } }
.mk-pin { position: relative; width: 26px; height: 34px; }
.mk-pin svg { display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
.mk-pin.pulse::after { inset: auto; left: 5px; top: 4px; width: 16px; height: 16px; }
.dim-marker { width: 8px; height: 8px; border-radius: 50%; background: #B9C3CC; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
.cluster { border-radius: 50%; background: #E8803E; color: #fff; display: flex; align-items: center; justify-content: center; font: 800 12px Inter, sans-serif; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); }

/* Etiketler */
.leaflet-tooltip { font-size: 11px; font-weight: 700; color: #2B2F2C; }
.live-label { background: #fff; border: none; box-shadow: 0 1px 4px rgba(0,0,0,.2); padding: 3px 8px; border-radius: 8px; }
.live-label::before { display: none; }
.live-label.eta { background: #276F4E; color: #fff; }
body.dark .live-label { background: #262A32; color: #EDEFF2; }
body.dark .live-label.eta { background: #348C61; }
.leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 8px 24px rgba(23,33,54,.25); }
.leaflet-popup-content { margin: 11px 13px; }
body.dark .leaflet-popup-content-wrapper, body.dark .leaflet-popup-tip { background: #262A32; color: #EDEFF2; }

/* Lejant */
#legend { position: absolute; left: 10px; bottom: 26px; z-index: 800; background: rgba(255,255,255,.94); border-radius: 10px; padding: 7px 10px; box-shadow: 0 2px 8px rgba(23,33,54,.18); font-size: 10.5px; font-weight: 600; color: #2B2F2C; display: none; flex-direction: column; gap: 4px; }
#legend.on { display: flex; }
#legend .row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#legend .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.12); flex-shrink: 0; }
body.dark #legend { background: rgba(30,34,41,.94); color: #EDEFF2; }
</style>
</head>
<body>
<div id="map"></div>
<div id="legend"></div>
<script>
var DISTRICTS = [
  { ad: "Beylikdüzü", lat: 41.0035, lng: 28.6412 },
  { ad: "Bakırköy", lat: 40.9829, lng: 28.8770 },
  { ad: "Fatih", lat: 41.0186, lng: 28.9497 },
  { ad: "Beşiktaş", lat: 41.0422, lng: 29.0061 },
  { ad: "Şişli", lat: 41.0602, lng: 28.9877 },
  { ad: "Üsküdar", lat: 41.0227, lng: 29.0122 },
  { ad: "Kadıköy", lat: 40.9927, lng: 29.0274 },
  { ad: "Ataşehir", lat: 40.9923, lng: 29.1244 },
  { ad: "Maltepe", lat: 40.9354, lng: 29.1500 },
  { ad: "Pendik", lat: 40.8778, lng: 29.2358 }
];

var map = L.map('map', { zoomControl: false, attributionControl: true }).setView([41.01, 29.06], 11);
L.control.zoom({ position: 'bottomright' }).addTo(map);
var params = new URLSearchParams(location.search);
var selectableMode = params.get('selectable') === '1';
var compactMode = params.get('compact') === '1'; // küçük, etkileşimsiz önizleme: kontrol yok
if (compactMode) document.body.classList.add('compact');
var selectedMarker = null;

// OSM standart tile — anahtar gerektirmez
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  subdomains: 'abc',
  maxZoom: 19
}).addTo(map);

// "Hepsini göster" butonu
var lastBounds = null;
var FitControl = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd: function () {
    var div = L.DomUtil.create('div', 'leaflet-bar');
    var a = L.DomUtil.create('a', 'fit-btn', div);
    a.href = '#'; a.title = 'Hepsini göster';
    a.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
    L.DomEvent.on(a, 'click', function (e) { L.DomEvent.stop(e); if (lastBounds) map.fitBounds(lastBounds, { padding: [48, 48], maxZoom: 14 }); });
    return div;
  }
});
map.addControl(new FitControl());

var legendEl = document.getElementById('legend');
function setLegend(rows) {
  if (!rows || !rows.length) { legendEl.className = ''; legendEl.innerHTML = ''; return; }
  legendEl.innerHTML = rows.map(function (r) { return '<div class="row"><span class="dot" style="background:' + r.color + '"></span>' + r.label + '</div>'; }).join('');
  legendEl.className = 'on';
}
function setTheme(dark) { document.body.classList.toggle('dark', !!dark); }

// --- İlçe noktaları (bölge vurgusu için) ---
var markers = {};
DISTRICTS.forEach(function (d) {
  var icon = L.divIcon({ className: '', html: '<div class="dim-marker"></div>', iconSize: [12, 12] });
  var m = L.marker([d.lat, d.lng], { icon: icon, interactive: false }).addTo(map);
  m.bindTooltip(d.ad, { direction: 'top', offset: [0, -6] });
  markers[d.ad] = m;
});

function highlight(color, names) {
  names = names || [];
  Object.keys(markers).forEach(function (ad) {
    var active = names.indexOf(ad) !== -1;
    var html = active
      ? '<div class="mk-self pulse" style="background:' + color + '"></div>'
      : '<div class="dim-marker"></div>';
    markers[ad].setIcon(L.divIcon({ className: '', html: html, iconSize: active ? [18, 18] : [12, 12] }));
  });
  var pts = names.map(function (n) { return markers[n] && markers[n].getLatLng(); }).filter(Boolean);
  if (pts.length) map.flyToBounds(L.latLngBounds(pts), { padding: [70, 70], duration: 0.6, maxZoom: 13 });
}

function districtLatLng(ad) {
  var d = DISTRICTS.find(function (x) { return x.ad === ad; });
  return d ? [d.lat, d.lng] : null;
}
function itemLatLng(it) {
  return Number.isFinite(Number(it && it.lat)) && Number.isFinite(Number(it && it.lng))
    ? [Number(it.lat), Number(it.lng)]
    : districtLatLng(it && it.ilce);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function initials(name) { return String(name || '?').split(/\s+/).map(function (p) { return p[0] || ''; }).join('').slice(0, 2).toUpperCase(); }

// --- İşaretçi türleri ---
function pinSvg(color) {
  return '<svg width="26" height="34" viewBox="0 0 26 34"><path d="M13 1C6.4 1 1 6.3 1 12.8 1 21.5 13 33 13 33s12-11.5 12-20.2C25 6.3 19.6 1 13 1z" fill="' + color + '" stroke="#fff" stroke-width="2"/><circle cx="13" cy="12.8" r="4.2" fill="#fff"/></svg>';
}
function makeIcon(it) {
  var kind = it.kind || 'spy';
  var pulse = it.pulse ? ' pulse' : '';
  if (kind === 'self') {
    return L.divIcon({ className: 'mk', html: '<div class="mk-self' + pulse + '" style="background:' + (it.color || '#276F4E') + '"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
  }
  if (kind === 'musteri') {
    return L.divIcon({ className: 'mk', html: '<div class="mk-pin' + pulse + '" style="background:' + (it.color || '#E8803E') + ';background-clip:content-box;">' + pinSvg(it.color || '#E8803E') + '</div>', iconSize: [26, 34], iconAnchor: [13, 33] });
  }
  var st = it.durumColor ? '<span class="st" style="background:' + it.durumColor + '"></span>' : '';
  return L.divIcon({ className: 'mk', html: '<div class="mk-avatar' + pulse + '" style="background:' + (it.color || '#276F4E') + '">' + esc(it.initials || initials(it.label)) + st + '</div>', iconSize: [30, 30], iconAnchor: [15, 15] });
}
function popupHtml(it) {
  var h = '<div style="font-family:Inter,sans-serif;min-width:150px;">' +
    '<div style="font:800 13px Inter,sans-serif;">' + esc(it.label) + '</div>';
  if (it.sube) h += '<div style="font-size:11px;opacity:.7;margin-top:2px;">' + esc(it.sube) + '</div>';
  if (it.durum) h += '<div style="display:inline-flex;align-items:center;gap:5px;margin-top:8px;font:700 10.5px Inter,sans-serif;color:' + (it.durumColor || '#276F4E') + ';border:1px solid ' + (it.durumColor || '#276F4E') + ';border-radius:6px;padding:3px 8px;"><span style="width:6px;height:6px;border-radius:99px;background:' + (it.durumColor || '#276F4E') + ';"></span>' + esc(it.durum) + '</div>';
  if (it.detay) h += '<div style="font-size:11px;opacity:.75;margin-top:6px;">' + esc(it.detay) + '</div>';
  return h + '</div>';
}

// --- Başvuru kümeleme (piksel mesafeli, plugin yok) ---
var basvuruLayer = L.layerGroup().addTo(map);
var basvuruPoints = [];
function renderClusters() {
  basvuruLayer.clearLayers();
  if (!basvuruPoints.length) return;
  var pts = basvuruPoints.map(function (p, i) { return { i: i, pt: map.latLngToContainerPoint(L.latLng(p.lat, p.lng)), data: p, used: false }; });
  var clusters = [];
  pts.forEach(function (p) {
    if (p.used) return;
    var group = [p]; p.used = true;
    pts.forEach(function (q) {
      if (q.used) return;
      var dx = p.pt.x - q.pt.x, dy = p.pt.y - q.pt.y;
      if (Math.sqrt(dx * dx + dy * dy) < 44) { group.push(q); q.used = true; }
    });
    clusters.push(group);
  });
  clusters.forEach(function (group) {
    var avgLat = group.reduce(function (a, g) { return a + g.data.lat; }, 0) / group.length;
    var avgLng = group.reduce(function (a, g) { return a + g.data.lng; }, 0) / group.length;
    if (group.length > 1) {
      var size = 28 + Math.min(group.length, 6) * 4;
      var icon = L.divIcon({ className: '', html: '<div class="cluster" style="width:' + size + 'px;height:' + size + 'px;">' + group.length + '</div>', iconSize: [size, size] });
      var names = group.map(function (g) { return esc(g.data.label); }).join(', ');
      L.marker([avgLat, avgLng], { icon: icon }).addTo(basvuruLayer)
        .bindTooltip(group.length + ' bekleyen müşteri', { direction: 'top', offset: [0, -size / 2], className: 'live-label' })
        .on('click', function () { map.flyTo([avgLat, avgLng], Math.min(map.getZoom() + 2, 15), { duration: .4 }); });
    } else {
      var it = group[0].data;
      L.marker([avgLat, avgLng], { icon: makeIcon({ kind: 'musteri', color: '#E8803E' }) }).addTo(basvuruLayer)
        .bindTooltip(esc(it.label || 'Müşteri'), { direction: 'top', offset: [0, -30], className: 'live-label' });
    }
  });
}
map.on('zoomend moveend', renderClusters);

map.on('click', function (event) {
  if (!selectableMode) return;
  var ll = event.latlng;
  if (selectedMarker) selectedMarker.setLatLng(ll);
  else {
    selectedMarker = L.marker(ll, { icon: makeIcon({ kind: 'self', pulse: true }) }).addTo(map).bindTooltip('Seçilen nokta', { permanent: true, direction: 'top', offset: [0, -12], className: 'live-label' });
  }
  parent.postMessage({ type: 'pointSelected', lat: ll.lat, lng: ll.lng }, '*');
});

// --- Canlı katman: SPY avatarları, müşteri pinleri, hareket eden temsilci + rota ---
var canliLayer = L.layerGroup().addTo(map);
var canliCache = { markers: {}, circle: null, lineDone: null, lineLeft: null, moveMarker: null, lastKey: null, didFit: false };

function renderCanli(items, moving) {
  var pts = [];
  // Anahtar sadece kimlik bilgisi içerir; durum/ETA gibi sık değişen alanlar yerinde güncellenir (popup kapanmasın)
  var itemsKey = (items || []).map(function (it) { return (it.kind || '') + '|' + (it.label || '') + '|' + it.color + '|' + (it.pulse ? 1 : 0) + '|' + (it.durumColor || ''); }).join(',') + '|' + (moving ? 'm' + (moving.label || '') : '');
  var setChanged = itemsKey !== canliCache.lastKey;
  canliCache.lastKey = itemsKey;

  if (setChanged) {
    Object.keys(canliCache.markers).forEach(function (k) { canliLayer.removeLayer(canliCache.markers[k]); });
    canliCache.markers = {};
    if (canliCache.circle) { canliLayer.removeLayer(canliCache.circle); canliCache.circle = null; }
    (items || []).forEach(function (it, i) {
      var ll = itemLatLng(it);
      if (!ll) return;
      var k = 'i' + i;
      var m = L.marker(ll, { icon: makeIcon(it), zIndexOffset: it.kind === 'self' ? 500 : 0 }).addTo(canliLayer);
      var yOff = it.kind === 'musteri' ? -34 : it.kind === 'self' ? -12 : -18;
      if (it.label && it.labelPermanent) m.bindTooltip(esc(it.label), { permanent: true, direction: 'top', offset: [0, yOff], className: 'live-label' });
      else if (it.label) m.bindTooltip(esc(it.label), { direction: 'top', offset: [0, yOff], className: 'live-label' });
      if (it.sube || it.durum || it.detay) m.bindPopup(popupHtml(it), { closeButton: false, minWidth: 160 });
      canliCache.markers[k] = m;
      pts.push(ll);
      if (it.radiusKm) {
        canliCache.circle = L.circle(ll, { radius: it.radiusKm * 1000, color: it.color || '#276F4E', weight: 1, opacity: .35, fillColor: it.color || '#276F4E', fillOpacity: .07, interactive: false }).addTo(canliLayer);
      }
    });
  } else {
    (items || []).forEach(function (it, i) {
      var ll = itemLatLng(it);
      if (!ll) return;
      var k = 'i' + i;
      var mk = canliCache.markers[k];
      if (mk) {
        mk.setLatLng(ll);
        if (mk.getPopup() && (it.sube || it.durum || it.detay)) mk.setPopupContent(popupHtml(it));
      }
      if (canliCache.circle && it.radiusKm) canliCache.circle.setLatLng(ll);
      pts.push(ll);
    });
  }

  if (moving) {
    var a = itemLatLng({ lat: moving.fromLat, lng: moving.fromLng, ilce: moving.fromIlce });
    var b = itemLatLng({ lat: moving.toLat, lng: moving.toLng, ilce: moving.toIlce });
    if (a && b) {
      var p = Math.max(0, Math.min(1, Number(moving.progress) || 0));
      var cur = [a[0] + (b[0] - a[0]) * p, a[1] + (b[1] - a[1]) * p];
      var color = moving.color || '#276F4E';
      if (!canliCache.lineDone || setChanged) {
        if (canliCache.lineDone) canliLayer.removeLayer(canliCache.lineDone);
        if (canliCache.lineLeft) canliLayer.removeLayer(canliCache.lineLeft);
        canliCache.lineLeft = L.polyline([cur, b], { color: color, weight: 4, opacity: .35, dashArray: '2 10', lineCap: 'round' }).addTo(canliLayer);
        canliCache.lineDone = L.polyline([a, cur], { color: color, weight: 4, opacity: .85, lineCap: 'round' }).addTo(canliLayer);
      } else {
        canliCache.lineDone.setLatLngs([a, cur]);
        canliCache.lineLeft.setLatLngs([cur, b]);
      }
      pts.push(cur);
      var label = moving.eta ? esc(moving.label) + ' · ' + esc(moving.eta) : esc(moving.label || '');
      if (!canliCache.moveMarker || setChanged) {
        if (canliCache.moveMarker) canliLayer.removeLayer(canliCache.moveMarker);
        canliCache.moveMarker = L.marker(cur, { icon: makeIcon({ kind: 'spy', color: color, label: moving.label, initials: moving.initials, pulse: true }), zIndexOffset: 600 }).addTo(canliLayer);
        if (label) canliCache.moveMarker.bindTooltip(label, { permanent: true, direction: 'top', offset: [0, -18], className: 'live-label eta' });
        if (moving.sube || moving.durum) canliCache.moveMarker.bindPopup(popupHtml(moving), { closeButton: false, minWidth: 160 });
      } else {
        canliCache.moveMarker.setLatLng(cur);
        if (label && canliCache.moveMarker.getTooltip()) canliCache.moveMarker.setTooltipContent(label);
      }
    }
  } else if (canliCache.moveMarker) {
    canliLayer.removeLayer(canliCache.moveMarker); canliCache.moveMarker = null;
    if (canliCache.lineDone) { canliLayer.removeLayer(canliCache.lineDone); canliCache.lineDone = null; }
    if (canliCache.lineLeft) { canliLayer.removeLayer(canliCache.lineLeft); canliCache.lineLeft = null; }
  }

  if (pts.length) lastBounds = L.latLngBounds(pts);
  if (pts.length && (setChanged || !canliCache.didFit)) {
    canliCache.didFit = true;
    map.fitBounds(lastBounds, { padding: [48, 48], maxZoom: 14, animate: false });
  }
}

window.addEventListener('message', function (e) {
  var d = e.data || {};
  if (d.dark != null) setTheme(!!d.dark);
  if (d.type === 'theme') setTheme(!!d.dark);
  if (d.type === 'select') highlight(d.color, d.districts);
  if (d.type === 'selectable') {
    selectableMode = true;
    if (d.center && Number.isFinite(Number(d.center.lat))) map.setView([Number(d.center.lat), Number(d.center.lng)], 13);
  }
  if (d.type === 'canli') { renderCanli(d.items, d.moving); if (d.legend) setLegend(d.legend); }
  if (d.type === 'basvurular') {
    basvuruPoints = (d.items || []).map(function (it, i) {
      var ll = itemLatLng(it);
      if (!ll) return null;
      var hasExact = Number.isFinite(Number(it.lat)) && Number.isFinite(Number(it.lng));
      var jitter = hasExact ? 0 : 0.006;
      return { lat: ll[0] + Math.sin(i * 2.1) * jitter, lng: ll[1] + Math.cos(i * 2.1) * jitter, ilce: it.ilce, label: it.label };
    }).filter(Boolean);
    renderClusters();
  }
});
</script>
</body>
</html>
