<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tasarruf Yanımda · Önizleme</title>
<style>
  :root{--yesil:#00724c;--zemin:#eef1f0;--kart:#fff;--yazi:#1f2a26;--soluk:#5f6b67;--cizgi:#dce3e0;--secili:#fff;--cerceve:#15201c}
  @media (prefers-color-scheme:dark){:root{--yesil:#5fc39a;--zemin:#111715;--kart:#1b2421;--yazi:#e8eeeb;--soluk:#a3b0ab;--cizgi:#2c3733;--secili:#2a3632;--cerceve:#000}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--zemin);color:var(--yazi);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
  header{padding:12px 16px 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
  .grup{display:inline-flex;background:var(--cizgi);border-radius:12px;padding:3px}
  .grup button{border:0;background:transparent;color:var(--soluk);font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer;min-height:38px}
  .grup button[aria-pressed="true"]{background:var(--secili);color:var(--yazi);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .grup button:focus-visible,.alt a:focus-visible{outline:2px solid var(--yesil);outline-offset:2px}
  .sahne{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;padding:4px 16px 8px}
  .cihaz{position:relative;flex:0 0 auto}
  .cihaz iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:#fff;display:block}
  .cihaz.telefon{border:6px solid var(--cerceve);border-radius:30px;overflow:hidden}
  .cihaz.bilgisayar{border:6px solid var(--cerceve);border-top-width:18px;border-radius:10px;overflow:hidden}
  .alt{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;padding:6px 16px 14px;font-size:13px}
  .alt a{color:var(--soluk)}
  .alt a.ana{color:var(--yesil);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="grup" role="group" aria-label="Ne gösterilsin">
    <button type="button" data-ne="uygulama" aria-pressed="true">Uygulama</button>
    <button type="button" data-ne="web" aria-pressed="false">Web formu</button>
  </div>
  <div class="grup" role="group" aria-label="Görünüm">
    <button type="button" data-gorunum="telefon" aria-pressed="true">Telefon</button>
    <button type="button" data-gorunum="bilgisayar" aria-pressed="false">Bilgisayar</button>
  </div>
</header>

<div class="sahne" id="sahne">
  <div class="cihaz telefon" id="cihaz"><iframe id="cerceve" title="Önizleme"></iframe></div>
</div>

<nav class="alt" aria-label="Diğer bağlantılar">
  <a class="ana" id="yeniSekme" href="#" target="_blank" rel="noopener">Tam ekran aç ↗</a>
  <a href="taslak/uygulama-akisi.html">Uygulama taslağı</a>
  <a href="taslak/web-akisi.html">Web taslağı</a>
  <a href="backup/2026-10-21-eski-uygulama/index.html">Uygulamanın eski hâli</a>
</nav>

<script>
(function () {
  var ADRES = {
    uygulama: { telefon: "Eminevim%20Saha%20Paneli.dc.html?native=1", bilgisayar: "Eminevim%20Saha%20Paneli.dc.html" },
    web: { telefon: "web-basvuru/", bilgisayar: "web-basvuru/" }
  };
  var BOYUT = { telefon: [390, 844], bilgisayar: [1440, 900] };
  var secim = { ne: "uygulama", gorunum: "telefon" };
  var m = /^#(uygulama|web)-(telefon|bilgisayar)$/.exec(location.hash);
  if (m) { secim.ne = m[1]; secim.gorunum = m[2]; }
  else { try { var k = JSON.parse(localStorage.getItem("ty-onizleme") || "null"); if (k && ADRES[k.ne] && BOYUT[k.gorunum]) secim = k; } catch (e) {} }

  var sahne = document.getElementById("sahne"), cihaz = document.getElementById("cihaz"), cerceve = document.getElementById("cerceve"), yeni = document.getElementById("yeniSekme");
  var yuklenen = "";

  function sigdir() {
    var b = BOYUT[secim.gorunum], kenar = 12 + (secim.gorunum === "bilgisayar" ? 12 : 0);
    var w = sahne.clientWidth - 32 - 12, h = sahne.clientHeight - 12 - kenar;
    var olcek = Math.min(w / b[0], h / b[1], 1);
    if (secim.gorunum === "telefon") olcek = Math.max(olcek, Math.min(w / b[0], 1) * 0.6);
    cerceve.style.width = b[0] + "px"; cerceve.style.height = b[1] + "px";
    cerceve.style.transform = "scale(" + olcek + ")";
    cihaz.style.width = Math.round(b[0] * olcek) + "px"; cihaz.style.height = Math.round(b[1] * olcek) + "px";
  }
  function uygula() {
    document.querySelectorAll("[data-ne]").forEach(function (x) { x.setAttribute("aria-pressed", x.dataset.ne === secim.ne ? "true" : "false"); });
    document.querySelectorAll("[data-gorunum]").forEach(function (x) { x.setAttribute("aria-pressed", x.dataset.gorunum === secim.gorunum ? "true" : "false"); });
    cihaz.className = "cihaz " + secim.gorunum;
    var adres = ADRES[secim.ne][secim.gorunum];
    var anahtar = adres + "|" + secim.gorunum;
    if (anahtar !== yuklenen) { cerceve.src = adres; yuklenen = anahtar; }
    yeni.href = adres;
    sigdir();
    try { history.replaceState(null, "", "#" + secim.ne + "-" + secim.gorunum); } catch (e) {}
    try { localStorage.setItem("ty-onizleme", JSON.stringify(secim)); } catch (e) {}
  }
  document.querySelectorAll("[data-ne]").forEach(function (x) { x.addEventListener("click", function () { secim.ne = x.dataset.ne; uygula(); }); });
  document.querySelectorAll("[data-gorunum]").forEach(function (x) { x.addEventListener("click", function () { secim.gorunum = x.dataset.gorunum; uygula(); }); });
  window.addEventListener("resize", sigdir);
  uygula();
})();
</script>
</body>
</html>
