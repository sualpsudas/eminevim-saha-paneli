<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Senaryo Akışı</title>
<script src="vendor/qrcode.min.js"></script>
<style>
  /* Senaryo tasarım tahtası: müşteri (telefon / bilgisayar) ve personel (tablet, yatay) adım adım.
     Ekranlar uygulamanın görünümüyle aynı ama her adım için sabit; onaylanan ekranlar sonra uygulamaya taşınır. */
  :root{--yesil:#00724c;--turuncu:#ea803f;--turuncuK:#b25e30;--zemin:#eef1f0;--kart:#fff;--yazi:#333;--soluk:#666;--cizgi:#dce3e0;--acik:#e9f0ed;--lacivert:#1e3856;--cerceve:#1c1c1e}
  @media (prefers-color-scheme:dark){:root{--zemin:#111715;--kart:#1b2421;--yazi:#e8eeeb;--soluk:#a3b0ab;--cizgi:#2c3733;--cerceve:#000}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--zemin);color:var(--yazi);font:15px/1.45 "Century Gothic",-apple-system,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  @supports (height:100dvh){html,body{height:100dvh}}
  button{font:inherit;cursor:pointer}
  [hidden]{display:none !important}
  button:focus-visible{outline:2px solid var(--yesil);outline-offset:2px}

  /* Üst: senaryo adı ve müşteri cihazı seçimi */
  .ust{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px 6px}
  .ust h1{font-size:16px;margin:0;flex:1;min-width:180px}
  .ust h1 small{display:block;font-size:12px;font-weight:400;color:var(--soluk)}
  .grup{display:inline-flex;background:var(--cizgi);border-radius:22px;padding:3px}
  .grup button{border:0;background:transparent;color:var(--soluk);font-size:13px;font-weight:700;padding:7px 13px;border-radius:22px;min-height:36px}
  .grup button[aria-pressed="true"]{background:var(--kart);color:var(--yazi);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  /* Sahne: iki cihaz yan yana */
  .sahne{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,var(--sol,1fr)) minmax(0,var(--sag,1.6fr));gap:18px;padding:6px 16px}
  .taraf{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center}
  .taraf .etiket{font-size:12px;font-weight:700;color:var(--soluk);letter-spacing:.4px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .taraf .etiket i{width:8px;height:8px;border-radius:50%;background:var(--cizgi)}
  .taraf.aktif .etiket{color:var(--turuncuK)}
  .taraf.aktif .etiket i{background:var(--turuncu);box-shadow:0 0 0 4px rgba(234,128,63,.25)}
  .yer{flex:1;min-height:0;width:100%;position:relative}
  .cihaz{position:absolute;left:50%;top:0;transform-origin:50% 0;transition:opacity .25s}
  .taraf:not(.aktif) .cihaz{opacity:.62}
  .cihaz .cam{position:absolute;inset:0;overflow:hidden;background:#f5f5f5}
  .cihaz.telefon{border:12px solid var(--cerceve);border-radius:56px}
  .cihaz.telefon .cam{border-radius:44px}
  .cihaz.telefon::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:30}
  .cihaz.tablet{border:20px solid var(--cerceve);border-radius:34px}
  .cihaz.tablet .cam{border-radius:16px}
  .cihaz.dizustu{border:14px solid var(--cerceve);border-bottom-width:18px;border-radius:16px 16px 6px 6px}
  .cihaz.dizustu::after{content:"";position:absolute;left:-60px;right:-60px;bottom:-34px;height:16px;background:#b9bec4;border-radius:0 0 18px 18px}

  /* Alt: açıklama ve kontrol */
  .alt{background:var(--kart);border-top:1px solid var(--cizgi);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .aciklama{flex:1;min-width:260px}
  .aciklama .no{font-size:12px;font-weight:700;color:var(--soluk)}
  .aciklama .kim{display:inline-block;font-size:11px;font-weight:700;border-radius:22px;padding:1px 9px;margin-left:6px;background:var(--acik);color:var(--yesil)}
  .aciklama .kim.p{background:#fce0d4;color:var(--turuncuK)}
  .aciklama b{display:block;font-size:16px;margin:2px 0}
  .aciklama p{margin:0;font-size:14px;color:var(--soluk)}
  .kontrol{display:flex;align-items:center;gap:8px}
  .kontrol button{min-height:44px;border-radius:22px;padding:0 16px;font-weight:700;font-size:14px}
  .k-geri{border:1.5px solid var(--yesil);background:var(--kart);color:var(--yesil)}
  .k-ileri{border:0;background:var(--turuncu);color:#fff}
  .k-oynat{border:1.5px solid var(--cizgi);background:var(--kart);color:var(--yazi)}
  .noktalar{display:flex;gap:5px;flex-wrap:wrap;max-width:260px}
  .noktalar button{width:22px;height:22px;border-radius:50%;border:0;padding:0;background:var(--cizgi);color:var(--soluk);font-size:10px;font-weight:700;min-height:0}
  .noktalar button.m{box-shadow:inset 0 0 0 2px var(--acik)}
  .noktalar button[aria-current="step"]{background:var(--yesil);color:#fff}
  .taraf-sec{display:none}

  /* Dar ekran (telefon): tek cihaz, etkin taraf öne gelir */
  @media (max-width:899px){
    .sahne{grid-template-columns:1fr;padding:4px 10px}
    .taraf{display:none}
    .taraf.goster{display:flex}
    .taraf-sec{display:inline-flex}
    .noktalar{display:none}
    .ust{padding:6px 10px 4px;gap:6px}
    .ust h1{font-size:14px}
    .ust h1 small{display:none}
    .grup button{padding:5px 10px;min-height:32px;font-size:12px}
    .alt{padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
    .aciklama b{font-size:15px}
    .aciklama p{font-size:13px}
    .kontrol{width:100%}
    .kontrol .k-ileri{flex:1}
  }

  /* ===== Ekran bileşenleri (eminevim.com görünümü) ===== */
  .ekr{position:absolute;inset:0;background:#f5f5f5;color:#666;font:14px/1.4 "Century Gothic","Segoe UI",Arial,sans-serif;overflow:hidden}
  .ekr b,.ekr h3{color:#4a4a4a}
  .ekr h3{margin:0;font-size:20px}
  .durum{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 34px;font-weight:700;font-size:14px;color:#111;background:#fff}
  .durum.y{background:#00724c;color:#fff}
  .ab{background:#00724c;color:#fff;padding:10px 16px 14px;display:flex;align-items:center;gap:10px}
  .ab img{height:15px}
  .ab .bs{flex:1;text-align:center}
  .ab .bs b{display:block;color:#fff;font-style:italic;font-size:16px}
  .ab .bs span{font-size:11px;opacity:.9}
  .ab .av{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .govde{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .kart{background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px 14px}
  .yk{background:#00724c;color:#fff;border-radius:22px;padding:14px 16px}
  .yk b{color:#fff;display:block;font-size:17px}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:22px;font-weight:700;font-size:14px;border:0;background:#ea803f;color:#fff;padding:0 16px}
  .btn.o{background:#fff;border:1.5px solid #00724c;color:#00724c}
  .btn.b{background:transparent;border:1.5px solid #fff;color:#fff}
  .btn.pasif{opacity:.45}
  .vurgu{position:relative;box-shadow:0 0 0 4px rgba(234,128,63,.55);animation:vurgu 1.4s ease-in-out infinite}
  @keyframes vurgu{50%{box-shadow:0 0 0 9px rgba(234,128,63,.12)}}
  .alan{background:#eee;border-radius:22px;padding:11px 16px;font-weight:700;color:#555}
  .satir{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
  .satir b{text-align:right}
  .adim{display:flex;gap:10px;align-items:center;font-weight:700;font-size:13px;color:#4a4a4a}
  .adim i{flex:0 0 20px;height:20px;border-radius:50%;background:#00724c;color:#fff;font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center}
  .adim.bos{color:#999}.adim.bos i{background:#eee}
  .rep{display:flex;align-items:center;gap:10px}
  .rep .bas{width:42px;height:42px;border-radius:50%;background:#1e3856;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .rep .ad{flex:1;min-width:0}
  .rep .ad b{display:block}
  .rep .ad span{font-size:12px}
  .rozet{display:inline-block;background:#e9f0ed;color:#00724c;font-size:11px;font-weight:700;border-radius:22px;padding:2px 9px}
  .rozet.t{background:#fce0d4;color:#b25e30}
  .sn{display:flex;border-top:1px solid #ddd;background:#fff;position:absolute;left:0;right:0;bottom:0;padding:6px 0 22px}
  .sn span{flex:1;text-align:center;font-size:10px;font-weight:700;color:#aaa}
  .sn span.a{color:#00724c}
  .sn span i{display:block;width:20px;height:20px;margin:0 auto 3px;border-radius:6px;border:2px solid currentColor}
  .bildirim{position:absolute;left:10px;right:10px;top:54px;z-index:20;background:rgba(255,255,255,.97);border-radius:18px;padding:10px 12px;box-shadow:0 10px 26px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;font-size:12.5px}
  .bildirim img{width:30px;height:30px;border-radius:8px;background:#00724c;padding:6px}
  .balon{max-width:82%;border-radius:16px;padding:8px 12px;font-size:13px;line-height:1.4;background:#fff;border:1px solid #ddd}
  .balon.ben{align-self:flex-end;background:#00724c;color:#fff;border-color:#00724c}
  .balon small{display:block;font-size:10px;opacity:.7;text-align:right;margin-top:2px}
  .chip{align-self:flex-start;border:1.5px solid #00724c;background:#e9f0ed;color:#00724c;border-radius:22px;padding:8px 14px;font-weight:700;font-size:13px}
  .alt-pen{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:20px 20px 30px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 -12px 30px rgba(0,0,0,.18)}
  .karart{position:absolute;inset:0;background:rgba(30,56,86,.5)}
  .qr{padding:10px;border:1px solid #ddd;border-radius:14px;background:#fff;line-height:0}
  .qr img{width:170px;height:170px;image-rendering:pixelated}
  .tik{width:70px;height:70px;border-radius:50%;background:#00724c;display:flex;align-items:center;justify-content:center}
  .yildiz{font-size:30px;letter-spacing:4px;color:#ea803f}
  .not{font-size:11.5px;color:#999}

  /* Site (web) */
  .site-ust{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee}
  .site-ust img{height:22px}
  .site-hero{height:150px;background:linear-gradient(160deg,#0a5a3e,#00724c 60%,#2d8a62);color:#fff;display:flex;align-items:flex-end;padding:14px 16px;font-weight:700;font-size:20px;line-height:1.15}
  .anahtar{display:flex;align-items:center;gap:10px;border:1.5px solid #00724c;background:#e9f0ed;color:#00724c;border-radius:22px;padding:9px 10px 9px 14px;font-weight:700;font-size:13px}
  .anahtar .s{margin-left:auto;width:42px;height:24px;border-radius:12px;background:#00724c;position:relative}
  .anahtar .s::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff}
  .onay{display:flex;gap:8px;font-size:11.5px;align-items:flex-start}
  .onay i{flex:0 0 16px;height:16px;border-radius:4px;background:#00724c}
  .pen-bas{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #eee;background:#fff}
  .pen-bas b{flex:1}
  .pen-bas small{display:block;font-weight:400;font-size:11.5px;color:#888}
  .gunler{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px}
  .gunler span{padding:7px 0;border-radius:10px;background:#eee;font-weight:700;color:#555}
  .gunler span.k{background:transparent;color:#bbb}
  .gunler span.s{background:#00724c;color:#fff}
  .gunler span.c{box-shadow:inset 0 -3px 0 #ea803f}
  .saatler{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .saatler span{text-align:center;padding:8px 0;border-radius:22px;background:#eee;font-weight:700;font-size:12.5px;color:#555}
  .saatler span.s{background:#00724c;color:#fff}
  .tarayici{height:38px;background:#f1f3f4;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #ddd}
  .tarayici i{width:10px;height:10px;border-radius:50%;background:#ddd}
  .tarayici span{flex:1;background:#fff;border-radius:16px;padding:5px 14px;font-size:12px;color:#555}

  /* Tablet (personel) */
  .tab{position:absolute;inset:0;display:flex;flex-direction:column;background:#f5f5f5}
  .ustb{background:#00724c;color:#fff;display:flex;align-items:center;padding:12px 22px;gap:12px}
  .ustb img{height:18px}
  .ustb .k{margin-left:auto;text-align:right;font-size:12px;line-height:1.25}
  .ustb .k b{display:block;color:#fff;font-size:13.5px}
  .ustb i{width:34px;height:34px;border-radius:50%;background:#1e3856;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:12px}
  .altb{display:flex;justify-content:center;background:#fff;border-top:1px solid #ddd;padding:6px 0 10px}
  .altb span{flex:0 1 180px;text-align:center;font-size:11px;font-weight:700;color:#aaa}
  .altb span.a{color:#00724c}
  .altb span i{display:block;width:20px;height:20px;margin:0 auto 3px;border-radius:6px;border:2px solid currentColor}
  .yan{width:200px;background:#00724c;color:#fff;display:flex;flex-direction:column;padding:22px 14px;gap:4px}
  .yan img{height:18px;align-self:flex-start;margin:0 0 18px 6px}
  .yan span{padding:10px 12px;border-radius:12px;font-weight:700;font-size:14px;opacity:.85}
  .yan span.a{background:rgba(255,255,255,.16);opacity:1}
  .yan .kisi{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;padding:10px 6px;border-top:1px solid rgba(255,255,255,.2)}
  .yan .kisi i{width:34px;height:34px;border-radius:50%;background:#1e3856;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700}
  .yan .durumu{display:inline-block;background:#a1cb3a;color:#1e3856;border-radius:22px;padding:1px 8px;font-size:10.5px;font-weight:700;margin-top:2px}
  .ana{flex:1;min-width:0;display:flex;flex-direction:column}
  .ana-bas{background:#fff;border-bottom:1px solid #ddd;padding:16px 22px;display:flex;align-items:center;gap:12px}
  .ana-bas h3{flex:1}
  .ana-bas span{font-size:13px}
  .iki{flex:1;min-height:0;display:grid;grid-template-columns:330px 1fr;gap:16px;padding:16px 22px}
  .liste{display:flex;flex-direction:column;gap:8px}
  .liste .kart{display:flex;gap:10px;align-items:center}
  .liste .kart.s{border-color:#00724c;box-shadow:inset 3px 0 0 #00724c}
  .liste .saat{font-weight:700;color:#00724c;width:46px}
  .detay{display:flex;flex-direction:column;gap:12px;min-width:0}
  .baslik-k{font-size:11px;font-weight:700;letter-spacing:.5px;color:#00724c}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .kpi .kart b{display:block;font-size:22px;color:#00724c}
  .tab-tara{position:absolute;inset:0;background:#1e3856;color:#fff;display:flex;align-items:center;justify-content:center;gap:50px}
  .cerceve-qr{width:300px;height:300px;position:relative;border-radius:24px;background:rgba(255,255,255,.06)}
  .cerceve-qr span{position:absolute;width:56px;height:56px;border:5px solid #ea803f}
  .cerceve-qr .c1{left:0;top:0;border-right:0;border-bottom:0;border-radius:24px 0 0 0}
  .cerceve-qr .c2{right:0;top:0;border-left:0;border-bottom:0;border-radius:0 24px 0 0}
  .cerceve-qr .c3{left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 24px}
  .cerceve-qr .c4{right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 24px 0}
  .cerceve-qr .cizgi{position:absolute;left:20px;right:20px;height:3px;background:#ea803f;box-shadow:0 0 14px #ea803f;animation:tara 2s ease-in-out infinite alternate}
  @keyframes tara{from{top:24px}to{top:272px}}
  .kucuk-qr{position:absolute;left:90px;top:90px;width:120px;height:120px;background:#fff;border-radius:8px;padding:6px}
  .kucuk-qr img{width:100%;height:100%;image-rendering:pixelated}
  .hesap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .buyuk{font-size:30px;font-weight:700;color:#fff}
  .sakin{opacity:.55}
  @media (prefers-reduced-motion:reduce){.vurgu,.cerceve-qr .cizgi{animation:none}}
</style>
</head>
<body>
<div class="ust">
  <h1><span id="senAd"></span><small id="senAlt"></small></h1>
  <div class="grup" role="group" aria-label="Senaryo">
    <button type="button" data-sn="uyg" aria-pressed="true">1 · Uygulamadan</button>
    <button type="button" data-sn="web" aria-pressed="false">2 · Web'den</button>
  </div>
  <div class="grup" role="group" aria-label="Müşteri cihazı" id="cihazSec">
    <button type="button" data-mc="telefon" aria-pressed="true">Müşteri: Telefon</button>
    <button type="button" data-mc="bilgisayar" aria-pressed="false">Müşteri: Bilgisayar</button>
  </div>
  <div class="grup taraf-sec" role="group" aria-label="Gösterilen taraf">
    <button type="button" data-ts="m" aria-pressed="true">Müşteri</button>
    <button type="button" data-ts="p" aria-pressed="false">Personel</button>
  </div>
</div>
<div class="sahne" id="sahne">
  <section class="taraf" id="tarafM" aria-label="Müşteri"><div class="etiket"><i></i><span id="etiketM">MÜŞTERİ · TELEFON</span></div><div class="yer" id="yerM"></div></section>
  <section class="taraf" id="tarafP" aria-label="Personel"><div class="etiket"><i></i><span>PERSONEL · TABLET</span></div><div class="yer" id="yerP"></div></section>
</div>
<div class="alt">
  <div class="aciklama" aria-live="polite"><span class="no" id="no"></span><span class="kim" id="kim"></span><b id="baslik"></b><p id="metin"></p></div>
  <div class="noktalar" id="noktalar" role="group" aria-label="Adımlar"></div>
  <div class="kontrol">
    <button type="button" class="k-geri" id="geri">‹ Geri</button>
    <button type="button" class="k-oynat" id="oynat" aria-pressed="false">Otomatik oynat</button>
    <button type="button" class="k-ileri" id="ileri">İleri ›</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var LOGO_Y = "assets/logo-green.png", LOGO_B = "assets/logo-white.png";
  var M = { ad: "Mehmet Demir", ilk: "Mehmet", kisa: "Mehmet D.", tel: "0532 123 45 67", yer: "Atatürk Mah., Ataşehir", gun: "23 Eki Perşembe", gunK: "Per 23 Eki", saat: "18:00" };
  var T = { ad: "Onur Kaya", bas: "OK", sube: "Ataşehir Şubesi", sicil: "48213", puan: "4,8", deneyim: "6 yıl", gorusme: "312" };
  var KOD = "4821";

  function qr(metin) {
    try { var q = window.qrcode(0, "M"); q.addData(metin); q.make(); return q.createDataURL(6, 2); } catch (e) { return ""; }
  }
  var QR = qr("EMINEVIM-TY|s1|" + KOD);
  function tik(boy) { boy = boy || 40; return '<svg width="' + boy + '" height="' + boy + '" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5L19 7"/></svg>'; }

  /* Basit harita çizimi: yollar, yeşil hizmet bölgesi, iğne ve istenirse rota */
  function harita(w, h, rota) {
